<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Scanr</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050711; font-family: 'Space Grotesk', sans-serif; padding: 24px; }
    .referral-banner { background: rgba(0,200,150,0.1); border: 1px solid #29ffb8; border-radius: 9px; padding: 0.9rem 1.2rem; margin-bottom: 1.5rem; color: #29ffb8; font-size: 0.875rem; text-align: center; font-weight: 500; }
    .auth-card { background: #0c1017; border: 1px solid #1a2030; border-radius: 16px; padding: 2.2rem 2rem; width: 100%; max-width: 420px; }
    .auth-logo { text-align: center; margin-bottom: 1.8rem; }
    .auth-logo-text { font-size: 2.2rem; font-weight: 800; color: #29ffb8; letter-spacing: -1px; }
    .auth-title { font-size: 1.25rem; font-weight: 700; color: #e5e9f2; text-align: center; margin-bottom: 0.35rem; }
    .auth-sub { font-size: 0.875rem; color: #6b7897; text-align: center; margin-bottom: 1.8rem; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .auth-field { margin-bottom: 1.1rem; }
    .auth-field label { display: block; font-size: 0.78rem; font-weight: 700; color: #7a8499; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
    .auth-input { width: 100%; background: #090c12; border: 1px solid #1e2535; border-radius: 9px; padding: 0.7rem 0.9rem; color: #e5e9f2; font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.15s; }
    .auth-input:focus { border-color: #29ffb8; }
    .auth-input::placeholder { color: #4a5568; }
    .pw-wrap { position: relative; }
    .pw-wrap .auth-input { padding-right: 52px; }
    .pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6b7897; cursor: pointer; font-size: 12px; font-family: inherit; font-weight: 600; }
    .auth-btn { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #00c896, #29ffb8); color: #000; border: none; border-radius: 9px; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit; margin-top: 0.4rem; transition: opacity 0.15s; }
    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .auth-msg { font-size: 0.875rem; font-weight: 600; text-align: center; margin-top: 0.9rem; min-height: 1.2rem; }
    .auth-link { text-align: center; margin-top: 1.4rem; font-size: 0.875rem; color: #6b7897; }
    .auth-link a { color: #29ffb8; text-decoration: none; font-weight: 600; }
    .auth-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div id="refBanner" class="referral-banner" style="display: none;">You were referred by a Scanr user — welcome!</div>
    <div class="auth-logo"><div class="auth-logo-text">Scanr</div></div>
    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Get started — it only takes a minute</div>

    <div class="row2">
      <div class="auth-field">
        <label>First Name</label>
        <input id="firstName" class="auth-input" type="text" placeholder="John" autocomplete="given-name">
      </div>
      <div class="auth-field">
        <label>Last Name</label>
        <input id="lastName" class="auth-input" type="text" placeholder="Doe" autocomplete="family-name">
      </div>
    </div>

    <div class="auth-field">
      <label>Email</label>
      <input id="email" class="auth-input" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <div class="pw-wrap">
        <input id="password" class="auth-input" type="password" placeholder="Min. 6 characters" autocomplete="new-password">
        <button class="pw-toggle" type="button" onclick="togglePw('password',this)">Show</button>
      </div>
    </div>
    <div class="auth-field">
      <label>Confirm Password</label>
      <div class="pw-wrap">
        <input id="confirm" class="auth-input" type="password" placeholder="Repeat password" autocomplete="new-password">
        <button class="pw-toggle" type="button" onclick="togglePw('confirm',this)">Show</button>
      </div>
    </div>

    <button id="regBtn" class="auth-btn">Create Account</button>
    <div id="msg" class="auth-msg"></div>
    <div class="auth-link">Already have an account? <a href="/login">Sign in</a></div>
  </div>

  <script src="/js/fingerprint.js"></script>
  <script>
    // Check for referral code and plan in URL
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    const planParam = urlParams.get('plan');
    const redirectParam = urlParams.get('redirect');

    if (refCode) {
      localStorage.setItem('scanr_ref_code', refCode);
      document.getElementById('refBanner').style.display = 'block';
    } else if (localStorage.getItem('scanr_ref_code')) {
      document.getElementById('refBanner').style.display = 'block';
    }

    // Redirect already-logged-in users
    fetch('/api/auth/session-check').then(r => r.ok ? r.json() : null).then(d => {
      if (d && d.valid) {
        // If logged in and trying to register with plan, redirect to payment
        if (planParam && redirectParam === 'payment') {
          window.location.replace(`/payment?plan=${planParam}`);
        } else {
          window.location.replace('/dashboard');
        }
      }
    }).catch(() => {});

    const $ = id => document.getElementById(id);
    const msg = $('msg');

    function togglePw(id, btn) {
      const inp = $(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
    }

    async function doRegister() {
      const firstName = $('firstName').value.trim();
      const lastName  = $('lastName').value.trim();
      const email     = $('email').value.trim();
      const password  = $('password').value;
      const confirm   = $('confirm').value;
      const btn       = $('regBtn');

      if (!firstName || !lastName || !email || !password || !confirm) {
        msg.style.color = '#f56565'; msg.textContent = 'All fields are required.'; return;
      }
      if (password !== confirm) {
        msg.style.color = '#f56565'; msg.textContent = 'Passwords do not match.'; return;
      }
      if (password.length < 6) {
        msg.style.color = '#f56565'; msg.textContent = 'Password must be at least 6 characters.'; return;
      }

      btn.disabled = true; btn.textContent = 'Creating account...';
      msg.textContent = '';
      try {
        const deviceFingerprint = (typeof window.getDeviceFingerprint === 'function') ? window.getDeviceFingerprint() : '';
        const pendingReferralCode = localStorage.getItem('scanr_ref_code');
        const r = await fetch('/api/auth/register', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, password, deviceFingerprint, pendingReferralCode }),
        });
        const d = await r.json();
        if (!r.ok) { msg.style.color = '#f56565'; msg.textContent = d.error || 'Registration failed.'; return; }
        msg.style.color = '#29ffb8'; msg.textContent = 'Account created! Redirecting...';
        localStorage.removeItem('scanr_ref_code');

        // Determine redirect destination
        let redirectUrl = '/payment';
        if (planParam && redirectParam === 'payment') {
          redirectUrl = `/payment?plan=${planParam}`;
        }

        setTimeout(() => { window.location.href = redirectUrl; }, 900);
      } catch (_) {
        msg.style.color = '#f56565'; msg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false; btn.textContent = 'Create Account';
      }
    }

    $('regBtn').addEventListener('click', doRegister);
    ['firstName','lastName','email','password','confirm'].forEach(id => {
      $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
    });
  </script>
</body>
</html>
