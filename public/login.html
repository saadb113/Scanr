<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Scanr</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050711; font-family: 'Space Grotesk', sans-serif; }
    .auth-card { background: #0c1017; border: 1px solid #1a2030; border-radius: 16px; padding: 2.2rem 2rem; width: 100%; max-width: 400px; margin: 1rem; }
    .auth-logo { text-align: center; margin-bottom: 1.8rem; }
    .auth-logo-text { font-size: 2.2rem; font-weight: 800; color: #29ffb8; letter-spacing: -1px; }
    .auth-title { font-size: 1.25rem; font-weight: 700; color: #e5e9f2; text-align: center; margin-bottom: 0.35rem; }
    .auth-sub { font-size: 0.875rem; color: #6b7897; text-align: center; margin-bottom: 1.8rem; }
    .auth-field { margin-bottom: 1.1rem; }
    .auth-field label { display: block; font-size: 0.78rem; font-weight: 700; color: #7a8499; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.4rem; }
    .auth-input { width: 100%; background: #090c12; border: 1px solid #1e2535; border-radius: 9px; padding: 0.7rem 0.9rem; color: #e5e9f2; font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.15s; }
    .auth-input:focus { border-color: #29ffb8; }
    .auth-btn { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #00c896, #29ffb8); color: #000; border: none; border-radius: 9px; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit; margin-top: 0.4rem; transition: opacity 0.15s; }
    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .auth-msg { font-size: 0.875rem; font-weight: 600; text-align: center; margin-top: 0.9rem; min-height: 1.2rem; }
    .auth-link { text-align: center; margin-top: 1.4rem; font-size: 0.875rem; color: #6b7897; }
    .auth-link a { color: #29ffb8; text-decoration: none; font-weight: 600; }
    .auth-link a:hover { text-decoration: underline; }
    .kicked-banner { display:none; background:#451a03; border:1px solid #92400e; border-radius:10px; padding:0.85rem 1rem; margin-bottom:1.2rem; font-size:0.845rem; color:#fcd34d; line-height:1.5; text-align:center; }
    .kicked-banner-icon { font-size:1.1rem; margin-bottom:0.3rem; }
  </style>
</head>
<body>
  <div class="auth-card">
  <div id="kickedBanner" class="kicked-banner">
    <div class="kicked-banner-icon">⚠️</div>
    Your previous session was ended because your account was accessed from another device or browser.
  </div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to your account</div>

    <div class="auth-field">
      <label>Email</label>
      <input id="email" class="auth-input" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input id="password" class="auth-input" type="password" placeholder="Your password" autocomplete="current-password">
    </div>

    <button id="loginBtn" class="auth-btn">Sign In</button>
    <div id="msg" class="auth-msg"></div>
    <div class="auth-link">Don't have an account? <a href="/register?plan=lifetime&redirect=payment">Register</a></div>
  </div>

  <script src="/js/fingerprint.js"></script>
  <script>
    // Redirect already-logged-in users
    fetch('/api/auth/session-check').then(r => r.ok ? r.json() : null).then(d => {
      if (d && d.valid) window.location.replace('/dashboard');
    }).catch(() => {});

    const $ = id => document.getElementById(id);
    const msg = $('msg');

    async function doLogin() {
      const email    = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) { msg.style.color = '#f56565'; msg.textContent = 'Please enter email and password.'; return; }
      const btn = $('loginBtn');
      btn.disabled = true; btn.textContent = 'Signing in...';
      msg.textContent = '';
      try {
        const deviceFingerprint = (typeof window.getDeviceFingerprint === 'function') ? window.getDeviceFingerprint() : '';
        const r = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, deviceFingerprint }),
        });
        const d = await r.json();
        if (!r.ok) { msg.style.color = '#f56565'; msg.textContent = d.error || 'Login failed.'; return; }
        if (d.licenseStatus === 'suspended') { window.location.href = '/suspended'; return; }
        if (d.licenseStatus !== 'active' && d.role !== 'admin') { window.location.href = '/license'; return; }
        const next = new URLSearchParams(window.location.search).get('next');
        window.location.href = (next && next.startsWith('/') && !next.startsWith('//')) ? next : '/dashboard';
      } catch (_) {
        msg.style.color = '#f56565'; msg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    }

    $('loginBtn').addEventListener('click', doLogin);
    [$('email'), $('password')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
    if (new URLSearchParams(window.location.search).get('kicked') === 'true') {
      $('kickedBanner').style.display = 'block';
    }
  </script>
</body>
</html>
