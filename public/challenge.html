<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prop Firm Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b11;--bg-card:#0d1117;--bg-raised:#121820;--bg-input:#0a0f16;
  --border:#1c2435;--border-mid:#243044;
  --text-primary:#dde4f0;--text-secondary:#9aa3b5;--text-muted:#5a6478;
  --green:#00e5a0;--red:#ff4d6a;--amber:#f5a623;--blue:#4da8ff;
  --green-dim:#051a10;--red-dim:#1a0509;--amber-dim:#1a1100;
  --font-ui:'Space Grotesk',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);font-size:clamp(14px,1vw,20px);line-height:1.5;-webkit-font-smoothing:antialiased}
html.light-mode{--bg:#f2f5fb;--bg-card:#ffffff;--bg-raised:#e8edf6;--bg-input:#edf1f8;--border:#cdd5e3;--border-mid:#b4bfcf;--text-primary:#1a2335;--text-secondary:#445068;--text-muted:#7080a0;}

.ch-wrap{max-width:800px;margin:0 auto;padding:1rem 1rem 3rem}

.ch-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.75rem}
.ch-title{font-size:1.4rem;font-weight:800;letter-spacing:-0.5px}
.ch-add-btn{
  background:linear-gradient(135deg,#0a3320,#00c57d);color:#fff;border:none;
  border-radius:var(--radius-sm);padding:0.45rem 1rem;font-size:0.82rem;font-weight:700;
  cursor:pointer;font-family:inherit;transition:opacity .15s;
}
.ch-add-btn:hover{opacity:0.85}

/* Form card */
.ch-form-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1.5rem;display:none}
.ch-form-card.open{display:block}
.ch-form-title{font-size:1rem;font-weight:700;margin-bottom:1rem;color:var(--text-primary)}
.ch-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
@media(max-width:500px){.ch-form-grid{grid-template-columns:1fr}}
.ch-field label{display:block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.3rem}
.ch-field input{
  width:100%;background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:0.45rem 0.65rem;color:var(--text-primary);
  font-family:var(--font-mono);font-size:0.88rem;transition:border-color .15s;
}
.ch-field input:focus{outline:none;border-color:var(--border-mid)}
.ch-field.wide{grid-column:1/-1}
.ch-form-btns{margin-top:1rem;display:flex;gap:0.5rem;justify-content:flex-end}
.ch-save-btn{background:var(--green);color:#000;border:none;border-radius:var(--radius-sm);padding:0.45rem 1.1rem;font-size:0.85rem;font-weight:800;cursor:pointer;font-family:inherit;transition:opacity .15s}
.ch-save-btn:hover{opacity:0.85}
.ch-cancel-btn{background:var(--bg-raised);border:1px solid var(--border);color:var(--text-secondary);border-radius:var(--radius-sm);padding:0.45rem 0.9rem;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s}
.ch-cancel-btn:hover{color:var(--text-primary);border-color:var(--border-mid)}
.ch-msg{font-size:0.78rem;color:var(--red);margin-top:0.5rem;display:none}

/* Challenge cards */
.ch-list{display:flex;flex-direction:column;gap:1.25rem}
.ch-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;position:relative}
.ch-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem;margin-bottom:1rem;flex-wrap:wrap}
.ch-card-title{font-size:1.05rem;font-weight:800;color:var(--text-primary)}
.ch-card-meta{font-size:0.72rem;color:var(--text-muted);margin-top:0.2rem}
.ch-badge{
  font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;
  padding:0.25rem 0.65rem;border-radius:15px;white-space:nowrap;
}
.ch-badge.on-track{background:var(--green-dim);color:var(--green);border:1px solid #0a3320}
.ch-badge.at-risk{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,166,35,0.3)}
.ch-badge.passed{background:var(--green-dim);color:var(--green);border:1px solid #0a3320}
.ch-badge.failed{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,0.3)}
.ch-badge.inactive{background:var(--bg-raised);color:var(--text-muted);border:1px solid var(--border)}

/* Meters */
.ch-meters{display:flex;flex-direction:column;gap:0.65rem}
.ch-meter{}
.ch-meter-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.25rem}
.ch-meter-label{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted)}
.ch-meter-val{font-family:var(--font-mono);font-size:0.8rem;font-weight:700}
.ch-bar-bg{height:6px;background:var(--bg-raised);border-radius:3px;overflow:hidden}
.ch-bar-fill{height:100%;border-radius:3px;transition:width .3s;min-width:0}

.ch-days-row{display:flex;align-items:center;gap:0.75rem;margin-top:0.85rem;flex-wrap:wrap}
.ch-days-chip{
  background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0.3rem 0.75rem;font-size:0.78rem;font-weight:700;color:var(--text-secondary);
  font-family:var(--font-mono);
}
.ch-delete-btn{
  position:absolute;top:1rem;right:1rem;background:none;border:none;
  color:var(--text-muted);font-size:0.8rem;cursor:pointer;padding:0.2rem 0.4rem;
  border-radius:var(--radius-sm);transition:color .15s,background .15s;
}
.ch-card{cursor:pointer;transition:border-color .15s}
.ch-card:hover{border-color:var(--border-mid)}
.ch-delete-btn:hover{color:var(--red);background:var(--red-dim)}

.ch-empty{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:0.9rem}
.ch-loading{text-align:center;padding:2rem;color:var(--text-muted)}
</style>
</head>
<body>
<script src="/js/nav.js"></script>
<div class="ch-wrap">

  <div class="ch-header">
    <div class="ch-title">🏆 Prop Firm Challenge</div>
    <button class="ch-add-btn" onclick="toggleForm()">+ New Challenge</button>
  </div>

  <!-- Add challenge form -->
  <div class="ch-form-card" id="chFormCard">
    <div class="ch-form-title">New Funded Account Challenge</div>
    <div class="ch-form-grid">
      <div class="ch-field wide">
        <label>Challenge Title</label>
        <input type="text" id="chTitle" placeholder="e.g. FTMO Phase 1" value="My Challenge"/>
      </div>
      <div class="ch-field">
        <label>Account Size ($)</label>
        <input type="number" id="chAcctSize" placeholder="10000" min="100"/>
      </div>
      <div class="ch-field">
        <label>Profit Target (%)</label>
        <input type="number" id="chProfitPct" placeholder="10" value="10" min="0.1" step="0.1"/>
      </div>
      <div class="ch-field">
        <label>Max Daily Drawdown (%)</label>
        <input type="number" id="chDailyDD" placeholder="5" value="5" min="0.1" step="0.1"/>
      </div>
      <div class="ch-field">
        <label>Max Total Drawdown (%)</label>
        <input type="number" id="chTotalDD" placeholder="10" value="10" min="0.1" step="0.1"/>
      </div>
      <div class="ch-field">
        <label>Start Date</label>
        <input type="date" id="chStartDate"/>
      </div>
      <div class="ch-field">
        <label>Duration (days)</label>
        <input type="number" id="chDuration" placeholder="30" value="30" min="1"/>
      </div>
    </div>
    <div id="chFormMsg" class="ch-msg"></div>
    <div class="ch-form-btns">
      <button class="ch-cancel-btn" onclick="toggleForm()">Cancel</button>
      <button class="ch-save-btn" onclick="saveChallenge()">Save Challenge</button>
    </div>
  </div>

  <!-- Challenge list -->
  <div id="chList"><div class="ch-loading">Loading challenges…</div></div>

</div>
<script>
const fmt2 = n => (n>=0?'+$':'-$') + Math.abs(n).toFixed(2);

// Set today as default start date
document.getElementById('chStartDate').value = new Date().toISOString().split('T')[0];

let challenges = [];

async function loadChallenges() {
  try {
    const r = await fetch('/api/challenge');
    const d = await r.json();
    challenges = d.challenges || [];
    renderChallenges();
  } catch(e) {
    document.getElementById('chList').innerHTML = '<div class="ch-empty">Failed to load challenges.</div>';
  }
}

function toggleForm() {
  const card = document.getElementById('chFormCard');
  card.classList.toggle('open');
  if (card.classList.contains('open')) {
    document.getElementById('chFormMsg').style.display = 'none';
  }
}

async function saveChallenge() {
  const title       = document.getElementById('chTitle').value.trim() || 'My Challenge';
  const accountSize = parseFloat(document.getElementById('chAcctSize').value);
  const profitTargetPct     = parseFloat(document.getElementById('chProfitPct').value);
  const maxDailyDrawdownPct = parseFloat(document.getElementById('chDailyDD').value);
  const maxTotalDrawdownPct = parseFloat(document.getElementById('chTotalDD').value);
  const startDate   = document.getElementById('chStartDate').value;
  const durationDays= parseInt(document.getElementById('chDuration').value) || 30;
  const msgEl = document.getElementById('chFormMsg');

  if (!accountSize || accountSize < 1) { showFormMsg('Account size required'); return; }
  if (!startDate) { showFormMsg('Start date required'); return; }

  try {
    const r = await fetch('/api/challenge', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ title, accountSize, profitTargetPct, maxDailyDrawdownPct, maxTotalDrawdownPct, startDate, durationDays })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Save failed');
    toggleForm();
    loadChallenges();
  } catch(e) { showFormMsg(e.message); }
}

function showFormMsg(msg) {
  const el = document.getElementById('chFormMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

async function deleteChallenge(id) {
  if (!confirm('Delete this challenge?')) return;
  await fetch('/api/challenge/' + id, { method:'DELETE' });
  loadChallenges();
}

function computeStatus(c, currentPnl) {
  const target    = c.accountSize * (c.profitTargetPct / 100);
  const maxDD     = c.accountSize * (c.maxTotalDrawdownPct / 100);
  if (currentPnl >= target) return 'passed';
  if (currentPnl <= -maxDD) return 'failed';
  const dailyDD   = c.accountSize * (c.maxDailyDrawdownPct / 100);
  const totalUsedPct = currentPnl < 0 ? (-currentPnl / maxDD) : 0;
  if (totalUsedPct > 0.7) return 'at-risk';
  return 'on-track';
}

function renderChallenges() {
  const el = document.getElementById('chList');
  if (!challenges.length) {
    el.innerHTML = '<div class="ch-empty">No challenges yet. Click "+ New Challenge" to get started.</div>';
    return;
  }
  el.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'ch-list';

  const today = new Date().toISOString().split('T')[0];

  challenges.forEach(c => {
    // Use stored metrics from FundedChallenge (updated by recalcChallenge on trade close)
    const currentPnl  = c.totalPnl    || 0;
    const todayPnl    = c.dailyDate === today ? (c.dailyPnl || 0) : 0;
    const totalDD     = c.totalDrawdown || 0; // negative number (worst loss from peak)
    const dailyDD     = c.dailyDrawdown || 0; // negative number (worst daily loss)

    const target       = c.accountSize * (c.profitTargetPct / 100);
    const maxDD        = c.accountSize * (c.maxTotalDrawdownPct / 100);
    const dailyDDLimit = c.accountSize * (c.maxDailyDrawdownPct / 100);

    // Days remaining
    const startDt  = new Date(c.startDate || today);
    const endDt    = new Date(startDt);
    endDt.setDate(endDt.getDate() + (c.durationDays || 30));
    const daysLeft = Math.max(0, Math.ceil((endDt - new Date()) / 86400000));

    const profitPct  = target      > 0 ? Math.min(100, Math.max(0, (currentPnl / target) * 100)) : 0;
    const totalDDPct = maxDD       > 0 ? Math.min(100, (-totalDD / maxDD) * 100)   : 0;
    const dailyDDPct = dailyDDLimit > 0 ? Math.min(100, (-dailyDD / dailyDDLimit) * 100) : 0;

    // Use stored status from DB; fallback to computed
    const status = c.status && c.status !== 'active'
      ? c.status
      : computeStatus(c, currentPnl);
    const finalStatus = daysLeft === 0 && status === 'on-track' ? 'failed' : status;

    const statusLabels = { 'on-track':'✅ ON TRACK', 'at-risk':'⚠️ AT RISK', 'passed':'✅ PASSED', 'failed':'❌ FAILED' };

    const profitBarColor = profitPct >= 100 ? 'var(--green)' : profitPct > 50 ? '#00c57d' : 'var(--blue)';
    const totalDDColor   = totalDDPct > 70   ? 'var(--red)' : totalDDPct > 40 ? 'var(--amber)' : 'var(--text-muted)';
    const dailyDDColor   = dailyDDPct > 70   ? 'var(--red)' : dailyDDPct > 40 ? 'var(--amber)' : 'var(--text-muted)';

    const card = document.createElement('div');
    card.className = 'ch-card';
    card.innerHTML = `
      <button class="ch-delete-btn" onclick="deleteChallenge('${c._id}')" title="Delete">✕</button>
      <div class="ch-card-top">
        <div>
          <div class="ch-card-title">${c.title || 'Challenge'}</div>
          <div class="ch-card-meta">$${(c.accountSize||0).toLocaleString()} account · ${c.profitTargetPct}% target · Started ${c.startDate || '—'}</div>
        </div>
        <span class="ch-badge ${finalStatus}">${statusLabels[finalStatus] || finalStatus.toUpperCase()}</span>
      </div>
      <div class="ch-meters">
        <div class="ch-meter">
          <div class="ch-meter-row">
            <span class="ch-meter-label">Profit Progress</span>
            <span class="ch-meter-val" style="color:${profitBarColor}">${currentPnl>=0?'+$':'-$'}${Math.abs(currentPnl).toFixed(2)} / $${target.toFixed(2)}</span>
          </div>
          <div class="ch-bar-bg"><div class="ch-bar-fill" style="width:${profitPct}%;background:${profitBarColor}"></div></div>
        </div>
        <div class="ch-meter">
          <div class="ch-meter-row">
            <span class="ch-meter-label">Daily Drawdown</span>
            <span class="ch-meter-val" style="color:${dailyDDColor}">${dailyDDPct.toFixed(1)}% used (limit $${dailyDDLimit.toFixed(0)})</span>
          </div>
          <div class="ch-bar-bg"><div class="ch-bar-fill" style="width:${dailyDDPct}%;background:${dailyDDColor}"></div></div>
        </div>
        <div class="ch-meter">
          <div class="ch-meter-row">
            <span class="ch-meter-label">Total Drawdown</span>
            <span class="ch-meter-val" style="color:${totalDDColor}">${totalDDPct.toFixed(1)}% used (limit $${maxDD.toFixed(0)})</span>
          </div>
          <div class="ch-bar-bg"><div class="ch-bar-fill" style="width:${totalDDPct}%;background:${totalDDColor}"></div></div>
        </div>
      </div>
      <div class="ch-days-row">
        <span class="ch-days-chip">⏱ ${daysLeft} day${daysLeft!==1?'s':''} remaining</span>
        <span class="ch-days-chip">📅 ${c.durationDays||30} day challenge</span>
        ${(c.tradesCount||0) > 0 ? `<span class="ch-days-chip">${c.wins||0}W / ${c.losses||0}L</span>` : ''}
      </div>
    `;
    card.addEventListener('click', e => {
      if (!e.target.closest('.ch-delete-btn')) window.location.href = '/challenge/' + c._id;
    });
    list.appendChild(card);
  });
  el.appendChild(list);
}

loadChallenges();
</script>
<script src="/js/session-check.js"></script>
</body>
</html>
