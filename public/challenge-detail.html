<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Challenge Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b11;--bg-card:#0d1117;--bg-raised:#121820;--bg-input:#0a0f16;
  --border:#1c2435;--border-mid:#243044;
  --text-primary:#dde4f0;--text-secondary:#9aa3b5;--text-muted:#5a6478;
  --green:#00e5a0;--red:#ff4d6a;--amber:#f5a623;--blue:#4da8ff;
  --green-dim:#051a10;--red-dim:#1a0509;--amber-dim:#1a1100;
  --font-ui:'Space Grotesk',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);font-size:clamp(13px,1vw,18px);line-height:1.5;-webkit-font-smoothing:antialiased}
html.light-mode{--bg:#f2f5fb;--bg-card:#ffffff;--bg-raised:#e8edf6;--bg-input:#edf1f8;--border:#cdd5e3;--border-mid:#b4bfcf;--text-primary:#1a2335;--text-secondary:#445068;--text-muted:#7080a0;}

/* ── Page wrapper ── */
.cd-page{max-width:1400px;margin:0 auto;padding:0.75rem 1rem 2rem}

/* ── Back + Title row ── */
.cd-toprow{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.85rem;flex-wrap:wrap}
.cd-back{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text-muted);font-size:0.8rem;font-weight:700;padding:0.3rem 0.7rem;
  cursor:pointer;font-family:inherit;text-decoration:none;transition:color .15s,border-color .15s;
}
.cd-back:hover{color:var(--text-primary);border-color:var(--border-mid)}
.cd-title{font-size:1.3rem;font-weight:800;letter-spacing:-0.4px;flex:1}
.cd-badge{font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;padding:0.25rem 0.7rem;border-radius:15px}
.cd-badge.active  {background:var(--bg-raised);color:var(--text-secondary);border:1px solid var(--border)}
.cd-badge.on-track{background:var(--green-dim);color:var(--green);border:1px solid #0a3320}
.cd-badge.at-risk {background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,166,35,0.3)}
.cd-badge.passed  {background:var(--green-dim);color:var(--green);border:1px solid #0a3320}
.cd-badge.failed  {background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,0.3)}

/* ── Metrics row ── */
.cd-metrics{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:0.65rem;margin-bottom:0.85rem;align-items:end}
@media(max-width:700px){.cd-metrics{grid-template-columns:1fr 1fr}}
.cd-meter{}
.cd-meter-lbl{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.25rem;display:flex;justify-content:space-between}
.cd-bar-bg{height:6px;background:var(--bg-raised);border-radius:3px;overflow:hidden}
.cd-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.cd-days-chip{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.4rem 0.75rem;font-size:0.78rem;font-weight:700;color:var(--text-secondary);font-family:var(--font-mono);white-space:nowrap;text-align:center}
.cd-days-chip small{display:block;font-size:0.6rem;color:var(--text-muted);font-weight:400}

/* ── Main layout ── */
.cd-layout{display:grid;grid-template-columns:1fr 300px;gap:1rem;align-items:start}
@media(max-width:960px){.cd-layout{grid-template-columns:1fr}}

/* ── Left panel ── */
.cd-left{}
.cd-chart-wrap{background:#000;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:0.85rem}
#tv-chart{width:100%;height:480px}

/* ── Tabs ── */
.cd-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:0}
.cd-tab{background:none;border:none;border-bottom:2px solid transparent;
  cursor:pointer;font-family:var(--font-ui);font-size:0.8rem;font-weight:700;
  color:var(--text-muted);padding:0.55rem 1rem;margin-bottom:-1px;transition:color .15s,border-color .15s}
.cd-tab.active{color:var(--green);border-bottom-color:var(--green)}
.cd-tab:hover:not(.active){color:var(--text-secondary)}
.cd-tab-content{display:none;background:var(--bg-card);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:0.85rem;min-height:200px}
.cd-tab-content.active{display:block}

/* ── Tables ── */
.cd-tbl{width:100%;border-collapse:collapse;font-size:0.78rem}
.cd-tbl th{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);padding:0.3rem 0.6rem;text-align:left;border-bottom:1px solid var(--border)}
.cd-tbl td{padding:0.45rem 0.6rem;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:middle}
.cd-tbl tr:last-child td{border-bottom:none}
.cd-tbl .mono{font-family:var(--font-mono)}
.cd-tbl .green{color:var(--green)}
.cd-tbl .red{color:var(--red)}
.cd-tbl .side-long{color:var(--green);font-weight:700}
.cd-tbl .side-short{color:var(--red);font-weight:700}
.cd-tbl-empty{text-align:center;padding:2rem;color:var(--text-muted);font-size:0.85rem}
.cd-close-btn{background:var(--red-dim);border:1px solid rgba(255,77,106,0.3);color:var(--red);border-radius:4px;padding:0.2rem 0.55rem;font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.cd-close-btn:hover{background:#3a0510}
.cd-win-badge{background:var(--green-dim);color:var(--green);border:1px solid #0a3320;border-radius:4px;padding:0.15rem 0.45rem;font-size:0.68rem;font-weight:800}
.cd-loss-badge{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,0.3);border-radius:4px;padding:0.15rem 0.45rem;font-size:0.68rem;font-weight:800}

/* ── Daily PnL chart ── */
.cd-pnl-chart{position:relative;height:260px}

/* ── Right sidebar — Order form ── */
.cd-sidebar{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;}
.cd-sidebar-title{font-size:0.9rem;font-weight:800;margin-bottom:0.85rem;color:var(--text-primary)}
.cd-field{margin-bottom:0.65rem}
.cd-field label{display:block;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.25rem}
.cd-field input,.cd-field select{
  width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text-primary);
  border-radius:var(--radius-sm);padding:0.4rem 0.6rem;font-family:var(--font-mono);font-size:0.85rem;
  transition:border-color .15s;
}
.cd-field input:focus,.cd-field select:focus{outline:none;border-color:var(--border-mid)}
.cd-side-btns{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.65rem}
.cd-long-btn,.cd-short-btn{
  padding:0.45rem;font-size:0.85rem;font-weight:800;border:2px solid;border-radius:var(--radius-sm);
  cursor:pointer;font-family:inherit;transition:background .15s,color .15s;
}
.cd-long-btn {border-color:#0a3320;background:var(--green-dim);color:var(--green)}
.cd-long-btn.active{background:var(--green);color:#000;border-color:var(--green)}
.cd-short-btn{border-color:rgba(255,77,106,0.3);background:var(--red-dim);color:var(--red)}
.cd-short-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
.cd-lev-row{display:flex;align-items:center;gap:0.5rem}
.cd-lev-row input[type=range]{flex:1;accent-color:var(--green)}
.cd-lev-val{font-family:var(--font-mono);font-size:0.82rem;font-weight:700;color:var(--green);min-width:36px}
.cd-rr-display{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.4rem 0.65rem;font-family:var(--font-mono);font-size:0.85rem;font-weight:700;color:var(--text-muted)}
.cd-place-btn{
  width:100%;margin-top:0.75rem;padding:0.55rem;font-size:0.9rem;font-weight:800;
  border:none;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;
  transition:opacity .15s;
}
.cd-place-btn.long {background:var(--green);color:#000}
.cd-place-btn.short{background:var(--red);color:#fff}
.cd-place-btn:disabled{opacity:0.5;cursor:not-allowed}
.cd-place-msg{font-size:0.75rem;margin-top:0.4rem;text-align:center;min-height:1.1em}

/* ── Type toggle ── */
.cd-type-row{display:grid;grid-template-columns:1fr 1fr;gap:0.4rem;margin-bottom:0.65rem}
.cd-type-btn{background:var(--bg-raised);border:1px solid var(--border);color:var(--text-muted);border-radius:var(--radius-sm);padding:0.35rem;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.cd-type-btn.active{background:var(--bg-card);border-color:var(--border-mid);color:var(--text-primary)}

/* ── Loading / error ── */
.cd-loading{text-align:center;padding:3rem;color:var(--text-muted)}
</style>
</head>
<body>
<script src="/js/nav.js"></script>
<div class="cd-page" id="cdPage" style="display:none">

  <!-- Title row -->
  <div class="cd-toprow">
    <a class="cd-back" href="/challenge">← Challenges</a>
    <div class="cd-title" id="cdTitle">Loading…</div>
    <span class="cd-badge" id="cdBadge">—</span>
  </div>

  <!-- Metrics row -->
  <div class="cd-metrics">
    <div class="cd-meter">
      <div class="cd-meter-lbl"><span>Profit Progress</span><span id="mProfitVal">—</span></div>
      <div class="cd-bar-bg"><div class="cd-bar-fill" id="mProfitBar" style="width:0%;background:var(--blue)"></div></div>
    </div>
    <div class="cd-meter">
      <div class="cd-meter-lbl"><span>Daily Drawdown</span><span id="mDailyVal">—</span></div>
      <div class="cd-bar-bg"><div class="cd-bar-fill" id="mDailyBar" style="width:0%;background:var(--text-muted)"></div></div>
    </div>
    <div class="cd-meter">
      <div class="cd-meter-lbl"><span>Total Drawdown</span><span id="mTotalVal">—</span></div>
      <div class="cd-bar-bg"><div class="cd-bar-fill" id="mTotalBar" style="width:0%;background:var(--text-muted)"></div></div>
    </div>
    <div class="cd-days-chip"><span id="mDaysLeft">—</span><small>days left</small></div>
  </div>

  <!-- Two-column layout -->
  <div class="cd-layout">

    <!-- LEFT -->
    <div class="cd-left">
      <div class="cd-chart-wrap"><div id="tv-chart"></div></div>

      <!-- Tabs -->
      <div class="cd-tabs">
        <button class="cd-tab active" data-tab="open">Open Positions</button>
        <button class="cd-tab" data-tab="history">Trade History</button>
        <button class="cd-tab" data-tab="pnl">Daily PnL</button>
      </div>

      <!-- Open Positions -->
      <div class="cd-tab-content active" id="tab-open">
        <div id="openPosBody"><div class="cd-tbl-empty">No open positions</div></div>
        <div id="openPosBody_pg" class="pg-bar"></div>
      </div>

      <!-- Trade History -->
      <div class="cd-tab-content" id="tab-history">
        <div id="historyBody"><div class="cd-tbl-empty">No trades yet</div></div>
        <div id="historyBody_pg" class="pg-bar"></div>
      </div>

      <!-- Daily PnL chart -->
      <div class="cd-tab-content" id="tab-pnl">
        <div class="cd-pnl-chart"><canvas id="pnlChart"></canvas></div>
      </div>
    </div>

    <!-- RIGHT — Order Form -->
    <div class="cd-sidebar">
      <div class="cd-sidebar-title">Place Trade</div>

      <div class="cd-field">
        <label>Symbol</label>
        <input type="text" id="ofSymbol" placeholder="BTCUSDT" value="BTCUSDT"/>
      </div>

      <div class="cd-side-btns">
        <button class="cd-long-btn active" id="ofLongBtn" onclick="ofSetSide('long')">▲ LONG</button>
        <button class="cd-short-btn"       id="ofShortBtn" onclick="ofSetSide('short')">▼ SHORT</button>
      </div>

      <div class="cd-type-row">
        <button class="cd-type-btn active" id="ofMarketBtn" onclick="ofSetType('market')">Market</button>
        <button class="cd-type-btn"        id="ofLimitBtn"  onclick="ofSetType('limit')">Limit</button>
      </div>

      <div class="cd-field">
        <label>Quantity (USDT)</label>
        <input type="number" id="ofQty" placeholder="100" min="1"/>
      </div>

      <div class="cd-field">
        <label>Leverage — <span id="ofLevVal">1</span>x</label>
        <div class="cd-lev-row">
          <input type="range" id="ofLevSlider" min="1" max="125" value="1"
            oninput="document.getElementById('ofLevVal').textContent=this.value"/>
        </div>
      </div>

      <div class="cd-field">
        <label>Stop Loss</label>
        <input type="number" id="ofSL" placeholder="0.00" step="any" oninput="ofCalcRR()"/>
      </div>

      <div class="cd-field">
        <label>Take Profit</label>
        <input type="number" id="ofTP" placeholder="0.00" step="any" oninput="ofCalcRR()"/>
      </div>

      <div class="cd-field">
        <label>Risk:Reward</label>
        <div class="cd-rr-display" id="ofRRDisplay">—</div>
      </div>

      <button class="cd-place-btn long" id="ofPlaceBtn" onclick="placeTrade()">▲ Place Long</button>
      <div class="cd-place-msg" id="ofMsg"></div>
    </div>

  </div>
</div>

<div class="cd-loading" id="cdLoading">Loading challenge…</div>

<script>
// ── State ──────────────────────────────────────────────────────
const CHALLENGE_ID = window.location.pathname.split('/').filter(Boolean).pop();
let challenge    = null;
let tvWidget     = null;
let pnlChart     = null;
let ofSide       = 'long';
let ofType       = 'market';
let pricePoller  = null;
let _previewPrice = null; // last fetched price for RR preview
let pnlChartLoaded = false;

// ── Boot ──────────────────────────────────────────────────────
async function boot() {
  try {
    const r = await fetch('/api/challenge/' + CHALLENGE_ID);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Failed to load');
    challenge = d.challenge;
    renderHeader();
    initTVChart('BTCUSDT');
    // Prefetch price for default symbol so RR works right away
    fetch('/api/proxy/binance?path=/fapi/v1/ticker/price&symbol=BTCUSDT')
      .then(r=>r.json()).then(d=>{ if(d?.price) _previewPrice = parseFloat(d.price); }).catch(()=>{});
    loadTrades();
    document.getElementById('cdLoading').style.display = 'none';
    document.getElementById('cdPage').style.display = '';
    pricePoller = setInterval(refreshOpenPositions, 10000);
  } catch(e) {
    document.getElementById('cdLoading').innerHTML = '<span style="color:var(--red)">Failed to load: ' + e.message + '</span>';
  }
}

// ── Header ────────────────────────────────────────────────────
function computeDisplayStatus(c) {
  if (c.status === 'passed' || c.status === 'failed') return c.status;
  const target   = c.accountSize * (c.profitTargetPct / 100);
  const maxDD    = c.accountSize * (c.maxTotalDrawdownPct / 100);
  const maxDayDD = c.accountSize * (c.maxDailyDrawdownPct / 100);
  if ((c.totalPnl||0) >= target)            return 'passed';
  if (-(c.dailyDrawdown||0) >= maxDayDD)    return 'failed';
  if (-(c.totalDrawdown||0) >= maxDD)       return 'failed';
  const totalDDPct = maxDD > 0 ? (-(c.totalDrawdown||0) / maxDD) * 100 : 0;
  const dailyDDPct = maxDayDD > 0 ? (-(c.dailyDrawdown||0) / maxDayDD) * 100 : 0;
  if (totalDDPct > 70 || dailyDDPct > 70)   return 'at-risk';
  return 'on-track';
}

function renderHeader() {
  const c = challenge;
  document.getElementById('cdTitle').textContent = c.title + ' — $' + (c.accountSize||0).toLocaleString();
  document.title = c.title + ' — Challenge';

  const dispStatus = computeDisplayStatus(c);
  updateBadge(dispStatus);

  const target   = c.accountSize * (c.profitTargetPct / 100);
  const maxDD    = c.accountSize * (c.maxTotalDrawdownPct / 100);
  const maxDayDD = c.accountSize * (c.maxDailyDrawdownPct / 100);

  const profitPct  = target  > 0 ? Math.min(100, Math.max(0, ((c.totalPnl||0) / target) * 100)) : 0;
  const totalDDPct = maxDD   > 0 ? Math.min(100, (-(c.totalDrawdown||0) / maxDD)   * 100)   : 0;
  const dailyDDPct = maxDayDD > 0 ? Math.min(100, (-(c.dailyDrawdown||0) / maxDayDD) * 100) : 0;

  const pC = profitPct >= 100 ? 'var(--green)' : 'var(--blue)';
  const tC = totalDDPct > 70  ? 'var(--red)'   : totalDDPct > 40 ? 'var(--amber)' : 'var(--text-muted)';
  const dC = dailyDDPct > 70  ? 'var(--red)'   : dailyDDPct > 40 ? 'var(--amber)' : 'var(--text-muted)';

  setBar('mProfitBar', profitPct, pC); setVal('mProfitVal', fmt2(c.totalPnl||0) + ' / $' + target.toFixed(0));
  setBar('mTotalBar',  totalDDPct, tC); setVal('mTotalVal', totalDDPct.toFixed(1) + '% used');
  setBar('mDailyBar',  dailyDDPct, dC); setVal('mDailyVal', dailyDDPct.toFixed(1) + '% used');

  const endDt    = new Date(c.startDate);
  endDt.setDate(endDt.getDate() + (c.durationDays||30));
  const daysLeft = Math.max(0, Math.ceil((endDt - new Date()) / 86400000));
  document.getElementById('mDaysLeft').textContent = daysLeft;
}

function updateBadge(status) {
  const badge = document.getElementById('cdBadge');
  const lm = { active:'ACTIVE', 'on-track':'✅ ON TRACK', 'at-risk':'⚠️ AT RISK', passed:'✅ PASSED', failed:'❌ FAILED' };
  badge.className  = 'cd-badge ' + (status === 'active' ? 'active' : status);
  badge.textContent = lm[status] || status.toUpperCase();
}

function setBar(id, pct, color) {
  const el = document.getElementById(id);
  if (el) { el.style.width = pct + '%'; el.style.background = color; }
}
function setVal(id, text) { const el = document.getElementById(id); if(el) el.textContent = text; }
const fmt2 = n => (n>=0?'+$':'-$') + Math.abs(n).toFixed(2);
const fmtP = n => parseFloat(n).toFixed(4);

// ── TradingView ───────────────────────────────────────────────
function initTVChart(symbol) {
  if (tvWidget) { try { tvWidget.remove(); } catch(_){} }
  tvWidget = new TradingView.widget({
    container_id:      'tv-chart',
    symbol:            symbol,
    interval:          '5',
    theme:             'dark',
    style:             '1',
    hide_side_toolbar: false,
    allow_symbol_change: true,
    height:            480,
    width:             '100%',
    locale:            'en',
    toolbar_bg:        '#0d1117',
    withdateranges:    true,
    save_image:        false,
  });
}

let tvDebounce = null;
document.getElementById('ofSymbol').addEventListener('input', e => {
  clearTimeout(tvDebounce);
  tvDebounce = setTimeout(() => {
    const sym = e.target.value.trim().toUpperCase();
    if (sym.length >= 3) initTVChart(sym);
  }, 800);
});

// ── Tab switching ─────────────────────────────────────────────
document.querySelectorAll('.cd-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.cd-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.cd-tab-content').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    const pg = document.getElementById('tab-' + tab.dataset.tab);
    if (pg) pg.classList.add('active');
    if (tab.dataset.tab === 'pnl') loadDailyPnl();
    if (tab.dataset.tab === 'open') refreshOpenPositions();
    if (tab.dataset.tab === 'history') loadTrades();
  });
});

// ── Load all trades ───────────────────────────────────────────
async function loadTrades() {
  try {
    const r = await fetch('/api/challenge/' + CHALLENGE_ID + '/trades');
    const d = await r.json();
    if (!d.ok) return;
    const open   = d.trades.filter(t => t.status === 'open');
    const closed = d.trades.filter(t => t.status === 'closed');
    renderOpenPositions(open);
    renderHistory(closed);
  } catch(e) {}
}

async function refreshOpenPositions() {
  try {
    const r = await fetch('/api/challenge/' + CHALLENGE_ID + '/trades/open');
    const d = await r.json();
    if (!d.ok) return;
    // Enrich with current prices
    const symbols = [...new Set(d.trades.map(t => t.symbol))];
    const priceMap = {};
    await Promise.all(symbols.map(async sym => {
      try {
        const pr = await fetch('/api/proxy/binance?path=/fapi/v1/ticker/price&symbol=' + sym);
        const pd = await pr.json();
        priceMap[sym] = parseFloat(pd?.price);
      } catch(_) {}
    }));
    renderOpenPositions(d.trades, priceMap);
  } catch(e) {}
}

let _openTrades = [], _openPriceMap = {};
function renderOpenPositions(trades, priceMap = {}) {
  _openTrades = trades;
  _openPriceMap = priceMap;
  const el = document.getElementById('openPosBody');
  if (!trades.length) { el.innerHTML = '<div class="cd-tbl-empty">No open positions</div>'; return; }
  pgSetup('openPosBody', trades, _doRenderOpenPos);
}

function _doRenderOpenPos(slice) {
  const el = document.getElementById('openPosBody');
  el.innerHTML = `
    <table class="cd-tbl">
      <thead><tr>
        <th>Symbol</th><th>Side</th><th>Size</th><th>Entry</th>
        <th>Current</th><th>Unr. PnL</th><th>SL</th><th>TP</th><th></th>
      </tr></thead>
      <tbody>
      ${slice.map(t => {
        const cur  = _openPriceMap[t.symbol] || t.entryPrice;
        const dir  = t.side === 'long' ? 1 : -1;
        const upnl = ((cur - t.entryPrice) / t.entryPrice) * t.quantity * (t.leverage||1) * dir;
        const pc   = upnl >= 0 ? 'green' : 'red';
        return `<tr>
          <td class="mono">${t.symbol}</td>
          <td class="side-${t.side}">${t.side.toUpperCase()}</td>
          <td class="mono">$${parseFloat(t.quantity).toFixed(2)}</td>
          <td class="mono">${parseFloat(t.entryPrice).toFixed(4)}</td>
          <td class="mono">${cur.toFixed(4)}</td>
          <td class="mono ${pc}">${fmt2(upnl)}</td>
          <td class="mono">${t.sl ? parseFloat(t.sl).toFixed(4) : '—'}</td>
          <td class="mono">${t.tp ? parseFloat(t.tp).toFixed(4) : '—'}</td>
          <td><button class="cd-close-btn" onclick="closeTrade('${t._id}')">Close</button></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;
}

let _histTrades = [];
function renderHistory(trades) {
  _histTrades = trades;
  const el = document.getElementById('historyBody');
  if (!trades.length) { el.innerHTML = '<div class="cd-tbl-empty">No closed trades yet</div>'; return; }
  pgSetup('historyBody', trades, _doRenderHistory);
}

function _doRenderHistory(slice) {
  const el = document.getElementById('historyBody');
  el.innerHTML = `
    <table class="cd-tbl">
      <thead><tr>
        <th>Date</th><th>Symbol</th><th>Side</th><th>Entry</th>
        <th>Exit</th><th>PnL</th><th>RR</th><th>Result</th>
      </tr></thead>
      <tbody>
      ${slice.map(t => {
        const pnl = parseFloat(t.pnl)||0;
        const pc  = pnl >= 0 ? 'green' : 'red';
        const dt  = t.closedAt ? new Date(t.closedAt).toLocaleDateString() : '—';
        return `<tr>
          <td>${dt}</td>
          <td class="mono">${t.symbol}</td>
          <td class="side-${t.side}">${t.side.toUpperCase()}</td>
          <td class="mono">${parseFloat(t.entryPrice).toFixed(4)}</td>
          <td class="mono">${t.exitPrice ? parseFloat(t.exitPrice).toFixed(4) : '—'}</td>
          <td class="mono ${pc}">${fmt2(pnl)}</td>
          <td class="mono">${t.rrAchieved ? t.rrAchieved + ':1' : '—'}</td>
          <td>${pnl >= 0
            ? '<span class="cd-win-badge">WIN</span>'
            : '<span class="cd-loss-badge">LOSS</span>'}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;
}

// ── Daily PnL Chart ───────────────────────────────────────────
async function loadDailyPnl() {
  try {
    const r = await fetch('/api/challenge/' + CHALLENGE_ID + '/daily-pnl');
    const d = await r.json();
    if (!d.ok) return;
    renderPnlChart(d.data);
  } catch(e) {}
}

function renderPnlChart(data) {
  const labels  = data.map(d => d.date.slice(5)); // MM-DD
  const vals    = data.map(d => d.pnl);
  const running = data.map(d => d.running);
  const colors  = vals.map(v => v >= 0 ? 'rgba(0,229,160,0.7)' : 'rgba(255,77,106,0.7)');
  const borderC = vals.map(v => v >= 0 ? '#00e5a0' : '#ff4d6a');

  if (pnlChart) pnlChart.destroy();
  const ctx = document.getElementById('pnlChart').getContext('2d');
  pnlChart = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        {
          type: 'bar', label: 'Daily PnL',
          data: vals, backgroundColor: colors, borderColor: borderC, borderWidth: 1, borderRadius: 3,
          yAxisID: 'y',
        },
        {
          type: 'line', label: 'Running Total',
          data: running,
          borderColor: '#4da8ff', borderWidth: 2, pointRadius: 2,
          fill: false, tension: 0.3, yAxisID: 'y',
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color:'#9aa3b5', font:{ size:11 } } } },
      scales: {
        x: { ticks:{ color:'#5a6478',font:{size:10} }, grid:{ color:'#1c2435' } },
        y: { ticks:{ color:'#9aa3b5',font:{size:10}, callback: v => '$'+v.toFixed(0) }, grid:{ color:'#1c2435' } },
      },
    },
  });
}

// ── Order form ────────────────────────────────────────────────
function ofSetSide(side) {
  ofSide = side;
  document.getElementById('ofLongBtn').classList.toggle('active', side === 'long');
  document.getElementById('ofShortBtn').classList.toggle('active', side === 'short');
  const btn = document.getElementById('ofPlaceBtn');
  btn.className = 'cd-place-btn ' + side;
  btn.textContent = (side === 'long' ? '▲ Place Long' : '▼ Place Short');
  ofCalcRR();
}

function ofSetType(type) {
  ofType = type;
  document.getElementById('ofMarketBtn').classList.toggle('active', type === 'market');
  document.getElementById('ofLimitBtn').classList.toggle('active', type === 'limit');
}

// Fetch live price for RR preview when symbol changes
let _rrDebounce = null;
document.getElementById('ofSymbol').addEventListener('input', e => {
  clearTimeout(_rrDebounce);
  _rrDebounce = setTimeout(async () => {
    const sym = e.target.value.trim().toUpperCase();
    if (sym.length < 3) return;
    try {
      const r = await fetch('/api/proxy/binance?path=/fapi/v1/ticker/price&symbol=' + sym);
      const d = await r.json();
      if (d?.price) { _previewPrice = parseFloat(d.price); ofCalcRR(); }
    } catch(_) {}
  }, 600);
});

function ofCalcRR() {
  const sl   = parseFloat(document.getElementById('ofSL').value);
  const tp   = parseFloat(document.getElementById('ofTP').value);
  const disp = document.getElementById('ofRRDisplay');
  if (!sl || !tp || !_previewPrice) { disp.textContent = _previewPrice ? '—' : 'fetching price…'; return; }
  const slDist = Math.abs(_previewPrice - sl);
  const tpDist = Math.abs(tp - _previewPrice);
  if (slDist <= 0) { disp.textContent = '—'; return; }
  const rr = (tpDist / slDist).toFixed(2);
  disp.textContent = rr + ':1  (entry ≈ $' + _previewPrice.toFixed(4) + ')';
  disp.style.color = parseFloat(rr) >= 1 ? 'var(--green)' : 'var(--amber)';
}

// Prefetch price on SL/TP input too
['ofSL', 'ofTP'].forEach(id => document.getElementById(id).addEventListener('input', async () => {
  if (!_previewPrice) {
    const sym = document.getElementById('ofSymbol').value.trim().toUpperCase();
    if (sym.length >= 3) {
      try {
        const r = await fetch('/api/proxy/binance?path=/fapi/v1/ticker/price&symbol=' + sym);
        const d = await r.json();
        if (d?.price) _previewPrice = parseFloat(d.price);
      } catch(_) {}
    }
  }
  ofCalcRR();
}));

async function placeTrade() {
  const btn = document.getElementById('ofPlaceBtn');
  const msg = document.getElementById('ofMsg');
  const sym = document.getElementById('ofSymbol').value.trim().toUpperCase();
  const qty = parseFloat(document.getElementById('ofQty').value);
  const lev = parseInt(document.getElementById('ofLevSlider').value) || 1;
  const sl  = parseFloat(document.getElementById('ofSL').value);
  const tp  = parseFloat(document.getElementById('ofTP').value);

  if (!sym)  { showMsg(msg, '✗ Symbol required', 'var(--red)'); return; }
  if (!qty || qty < 1) { showMsg(msg, '✗ Quantity required', 'var(--red)'); return; }
  if (!sl)   { showMsg(msg, '✗ Stop loss required', 'var(--red)'); return; }
  if (!tp)   { showMsg(msg, '✗ Take profit required', 'var(--red)'); return; }

  btn.disabled = true;
  btn.textContent = 'Placing…';
  try {
    const r = await fetch('/api/challenge/' + CHALLENGE_ID + '/trade/place', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ symbol: sym, side: ofSide, orderType: ofType, quantity: qty, leverage: lev, sl, tp }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Failed');
    showMsg(msg, '✓ Trade placed @ $' + parseFloat(d.trade.entryPrice).toFixed(4), 'var(--green)');
    document.getElementById('ofQty').value = '';
    document.getElementById('ofSL').value  = '';
    document.getElementById('ofTP').value  = '';
    document.getElementById('ofRRDisplay').textContent = '—';
    await loadTrades();
    // Switch to open positions tab
    document.querySelector('[data-tab="open"]').click();
  } catch(e) {
    showMsg(msg, '✗ ' + e.message, 'var(--red)');
  }
  btn.disabled = false;
  ofSetSide(ofSide);
}

async function closeTrade(tradeId) {
  if (!confirm('Close this position at market price?')) return;
  try {
    const r = await fetch('/api/challenge/' + CHALLENGE_ID + '/trade/close', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ tradeId }),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Close failed');
    // Update challenge object with new metrics
    if (d.metrics) {
      challenge.totalPnl     = d.metrics.totalPnl;
      challenge.dailyPnl     = d.metrics.dailyPnl;
      challenge.totalDrawdown= d.metrics.totalDrawdown;
      challenge.dailyDrawdown= d.metrics.dailyDrawdown;
      challenge.wins         = d.metrics.wins;
      challenge.losses       = d.metrics.losses;
      challenge.status       = d.metrics.status;
      renderHeader();
    }
    await loadTrades();
    loadDailyPnl();
  } catch(e) {
    alert('Close failed: ' + e.message);
  }
}

function showMsg(el, text, color) {
  el.textContent = text;
  el.style.color = color;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

// ── Boot ──────────────────────────────────────────────────────
boot();
</script>
