<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PnL Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b11;--bg-card:#0d1117;--bg-raised:#121820;--bg-input:#0a0f16;
  --border:#1c2435;--border-mid:#243044;
  --text-primary:#dde4f0;--text-secondary:#9aa3b5;--text-muted:#5a6478;
  --green:#00e5a0;--red:#ff4d6a;--amber:#f5a623;--blue:#4da8ff;
  --green-dim:#051a10;--red-dim:#1a0509;
  --font-ui:'Space Grotesk',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);font-size:clamp(14px,1vw,20px);line-height:1.5;-webkit-font-smoothing:antialiased}
html.light-mode{--bg:#f2f5fb;--bg-card:#ffffff;--bg-raised:#e8edf6;--bg-input:#edf1f8;--border:#cdd5e3;--border-mid:#b4bfcf;--text-primary:#1a2335;--text-secondary:#445068;--text-muted:#7080a0;}

.cal-wrap{max-width:1100px;margin:0 auto;padding:1rem 1rem 3rem}

.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:0.75rem}
.cal-title{font-size:1.4rem;font-weight:800;letter-spacing:-0.5px}
.cal-year-nav{display:flex;align-items:center;gap:0.5rem}
.cal-year-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-secondary);font-size:0.82rem;font-weight:700;padding:0.25rem 0.6rem;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s}
.cal-year-btn:hover{color:var(--text-primary);border-color:var(--border-mid)}
.cal-year-label{font-family:var(--font-mono);font-size:0.9rem;font-weight:700;color:var(--text-primary);min-width:3rem;text-align:center}

.cal-legend{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;margin-bottom:1.25rem}
.cal-leg-item{display:flex;align-items:center;gap:0.4rem;font-size:0.72rem;color:var(--text-muted)}
.cal-leg-sq{width:12px;height:12px;border-radius:2px;flex-shrink:0}

/* Stats bar */
.cal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0.75rem;margin-bottom:1.5rem}
@media(max-width:540px){.cal-stats{grid-template-columns:1fr 1fr}}
.cal-stat{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:0.85rem 1rem}
.cal-stat-label{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.3rem}
.cal-stat-val{font-size:1.35rem;font-weight:800;font-family:var(--font-mono);letter-spacing:-0.5px}
.val-green{color:var(--green)}
.val-red{color:var(--red)}

/* Calendar grid */
.cal-grid-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;overflow-x:auto}
.cal-month-labels{display:flex;gap:0;margin-bottom:0.4rem;padding-left:22px}
.cal-month-label{font-size:0.68rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.cal-grid{display:flex;gap:2px}
.cal-dow-col{display:flex;flex-direction:column;gap:2px;width:22px;flex-shrink:0}
.cal-dow-label{font-size:0.62rem;color:var(--text-muted);height:12px;line-height:12px;text-align:right;padding-right:4px}
.cal-weeks{display:flex;gap:2px}
.cal-week{display:flex;flex-direction:column;gap:2px}
.cal-day{
  width:12px;height:12px;border-radius:2px;cursor:pointer;
  background:var(--bg-raised);border:1px solid transparent;
  transition:transform .1s,border-color .1s;flex-shrink:0;
}
.cal-day:hover{transform:scale(1.35);border-color:var(--border-mid);z-index:1}
.cal-day.empty{cursor:default;background:transparent;border-color:transparent}
.cal-day.today{border-color:var(--text-secondary) !important}
.cal-day.profit{background:var(--green)}
.cal-day.profit.low{background:#007a54;opacity:0.8}
.cal-day.loss{background:var(--red)}
.cal-day.loss.low{background:#7a2030;opacity:0.8}

/* Tooltip */
.cal-tooltip{
  position:fixed;background:var(--bg-raised);border:1px solid var(--border-mid);
  border-radius:var(--radius-sm);padding:0.55rem 0.75rem;
  font-size:0.78rem;pointer-events:none;z-index:9999;
  box-shadow:0 4px 16px rgba(0,0,0,0.5);white-space:nowrap;
  opacity:0;transition:opacity .1s;
}
.cal-tooltip.visible{opacity:1}
.cal-tt-date{font-weight:700;color:var(--text-primary);margin-bottom:0.25rem}
.cal-tt-row{display:flex;justify-content:space-between;gap:1rem;color:var(--text-secondary)}
.cal-tt-row span:last-child{font-family:var(--font-mono);font-weight:700}
</style>
</head>
<body>
<script src="/js/nav.js"></script>
<div class="cal-wrap">

  <div class="cal-header">
    <div class="cal-title">📅 PnL Calendar</div>
    <div class="cal-year-nav">
      <button class="cal-year-btn" onclick="changeYear(-1)">← Prev</button>
      <span class="cal-year-label" id="calYearLabel">2025</span>
      <button class="cal-year-btn" onclick="changeYear(1)">Next →</button>
    </div>
  </div>

  <div class="cal-stats" id="calStats">
    <div class="cal-stat"><div class="cal-stat-label">Total PnL</div><div class="cal-stat-val" id="statTotalPnl">—</div></div>
    <div class="cal-stat"><div class="cal-stat-label">Green Days</div><div class="cal-stat-val val-green" id="statGreenDays">—</div></div>
    <div class="cal-stat"><div class="cal-stat-label">Red Days</div><div class="cal-stat-val val-red" id="statRedDays">—</div></div>
    <div class="cal-stat"><div class="cal-stat-label">Best Day</div><div class="cal-stat-val val-green" id="statBestDay">—</div></div>
  </div>

  <div class="cal-legend">
    <span class="cal-leg-item"><span class="cal-leg-sq" style="background:var(--green)"></span> Profitable day</span>
    <span class="cal-leg-item"><span class="cal-leg-sq" style="background:var(--red)"></span> Losing day</span>
    <span class="cal-leg-item"><span class="cal-leg-sq" style="background:var(--bg-raised);border:1px solid var(--border)"></span> No trades</span>
    <span class="cal-leg-item"><span class="cal-leg-sq" style="background:var(--bg-raised);border:1px solid var(--text-secondary)"></span> Today</span>
  </div>

  <div class="cal-grid-wrap">
    <div class="cal-month-labels" id="calMonthLabels"></div>
    <div class="cal-grid">
      <div class="cal-dow-col" id="calDowCol">
        <div class="cal-dow-label"></div>
        <div class="cal-dow-label">Mon</div>
        <div class="cal-dow-label"></div>
        <div class="cal-dow-label">Wed</div>
        <div class="cal-dow-label"></div>
        <div class="cal-dow-label">Fri</div>
        <div class="cal-dow-label"></div>
      </div>
      <div class="cal-weeks" id="calWeeks"></div>
    </div>
  </div>

</div>

<div class="cal-tooltip" id="calTooltip">
  <div class="cal-tt-date" id="ttDate"></div>
  <div class="cal-tt-row"><span>Trades</span><span id="ttTrades"></span></div>
  <div class="cal-tt-row"><span>PnL</span><span id="ttPnl"></span></div>
  <div class="cal-tt-row"><span>W/L</span><span id="ttWL"></span></div>
</div>

<script>
let calYear = new Date().getFullYear();
let calData = {};

document.getElementById('calYearLabel').textContent = calYear;

async function loadCalendar() {
  try {
    const r  = await fetch('/api/pnl-calendar');
    const d  = await r.json();
    calData  = d.data || {};
    renderCalendar();
  } catch(e) {
    console.error('Calendar load failed', e);
  }
}

function changeYear(delta) {
  calYear += delta;
  document.getElementById('calYearLabel').textContent = calYear;
  renderCalendar();
}

function renderCalendar() {
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];

  // Compute year stats
  let totalPnl = 0, greenDays = 0, redDays = 0, bestDay = 0;
  Object.entries(calData).forEach(([date, d]) => {
    if (!date.startsWith(calYear + '')) return;
    totalPnl += d.pnl || 0;
    if (d.pnl > 0) { greenDays++; if (d.pnl > bestDay) bestDay = d.pnl; }
    if (d.pnl < 0) redDays++;
  });
  const fmt2 = n => (n >= 0 ? '+$' : '-$') + Math.abs(n).toFixed(2);
  document.getElementById('statTotalPnl').textContent = fmt2(totalPnl);
  document.getElementById('statTotalPnl').style.color = totalPnl >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('statGreenDays').textContent = greenDays;
  document.getElementById('statRedDays').textContent = redDays;
  document.getElementById('statBestDay').textContent = bestDay > 0 ? '+$' + bestDay.toFixed(2) : '—';

  // Build weeks array: Jan 1 of year to Dec 31
  const jan1 = new Date(calYear, 0, 1);
  // Pad to start on Sunday
  const startDow = jan1.getDay(); // 0=Sun
  const weeks = [];
  let week = [];
  for (let i = 0; i < startDow; i++) week.push(null);

  const dec31 = new Date(calYear, 11, 31);
  const numDays = Math.round((dec31 - jan1) / 86400000) + 1;

  for (let i = 0; i < numDays; i++) {
    const d = new Date(calYear, 0, 1 + i);
    const dStr = d.toISOString().split('T')[0];
    week.push(dStr);
    if (week.length === 7) { weeks.push(week); week = []; }
  }
  if (week.length) {
    while (week.length < 7) week.push(null);
    weeks.push(week);
  }

  // Month labels
  const monthLabels = document.getElementById('calMonthLabels');
  monthLabels.innerHTML = '';
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let currentMonth = -1;
  weeks.forEach((w, wi) => {
    const firstReal = w.find(d => d !== null);
    if (firstReal) {
      const m = parseInt(firstReal.split('-')[1]) - 1;
      if (m !== currentMonth) {
        currentMonth = m;
        const span = document.createElement('div');
        span.className = 'cal-month-label';
        span.textContent = MONTHS[m];
        monthLabels.appendChild(span);
      } else {
        const span = document.createElement('div');
        span.className = 'cal-month-label';
        monthLabels.appendChild(span);
      }
    }
  });

  // Render weeks
  const weeksEl = document.getElementById('calWeeks');
  weeksEl.innerHTML = '';
  const tooltip = document.getElementById('calTooltip');

  weeks.forEach(w => {
    const weekEl = document.createElement('div');
    weekEl.className = 'cal-week';
    w.forEach(dateStr => {
      const dayEl = document.createElement('div');
      dayEl.className = 'cal-day';
      if (!dateStr) {
        dayEl.classList.add('empty');
      } else {
        const data = calData[dateStr];
        if (dateStr === todayStr) dayEl.classList.add('today');
        if (data && data.trades > 0) {
          if (data.pnl > 0) {
            dayEl.classList.add('profit');
            if (data.pnl < 50) dayEl.classList.add('low');
          } else if (data.pnl < 0) {
            dayEl.classList.add('loss');
            if (data.pnl > -50) dayEl.classList.add('low');
          }
          // Tooltip
          dayEl.addEventListener('mouseenter', e => {
            const [y,m,d] = dateStr.split('-');
            document.getElementById('ttDate').textContent = MONTHS[parseInt(m)-1] + ' ' + parseInt(d) + ', ' + y;
            document.getElementById('ttTrades').textContent = data.trades;
            const pnl = data.pnl || 0;
            document.getElementById('ttPnl').textContent = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2);
            document.getElementById('ttPnl').style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
            document.getElementById('ttWL').textContent = (data.wins||0) + ' / ' + (data.losses||0);
            tooltip.classList.add('visible');
          });
          dayEl.addEventListener('mousemove', e => {
            tooltip.style.left = (e.clientX + 12) + 'px';
            tooltip.style.top  = (e.clientY - 10) + 'px';
          });
          dayEl.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
        }
      }
      weekEl.appendChild(dayEl);
    });
    weeksEl.appendChild(weekEl);
  });
}

loadCalendar();
</script>
<script src="/js/session-check.js"></script>
</body>
</html>
