<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate License — Scanr</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050711; font-family: 'Space Grotesk', sans-serif; padding: 24px; }
    .card { background: #0c1017; border: 1px solid #1a2030; border-radius: 16px; padding: 2.8rem 2rem; width: 100%; max-width: 420px; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; font-weight: 800; color: #e5e9f2; margin-bottom: 10px; }
    .sub { font-size: 0.875rem; color: #6b7897; margin-bottom: 2rem; line-height: 1.6; }
    label { display: block; font-size: 0.78rem; font-weight: 700; color: #7a8499; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; text-align: left; }
    .key-input {
      width: 100%; background: #090c12; border: 1px solid #1e2535; border-radius: 9px;
      padding: 0.85rem 1rem; color: #29ffb8; font-size: 1.05rem; font-weight: 700;
      font-family: 'Courier New', monospace; letter-spacing: 1.5px; text-transform: uppercase;
      outline: none; transition: border-color 0.15s; text-align: center;
    }
    .key-input:focus { border-color: #29ffb8; }
    .key-input::placeholder { color: #2a3545; font-size: 0.95rem; letter-spacing: 1px; font-weight: 500; }
    .auth-btn { width: 100%; padding: 0.75rem; background: linear-gradient(135deg, #00c896, #29ffb8); color: #000; border: none; border-radius: 9px; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit; margin-top: 0.9rem; transition: opacity 0.15s; }
    .auth-btn:hover { opacity: 0.9; }
    .auth-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .msg { font-size: 0.875rem; font-weight: 600; margin-top: 0.9rem; min-height: 1.2rem; }
    .divider { border: none; border-top: 1px solid #1a2030; margin: 2rem 0 1.5rem; }
    .wa-text { font-size: 0.875rem; color: #6b7897; margin-bottom: 0.85rem; }
    .wa-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #25d366; color: #000; border: none; border-radius: 9px;
      padding: 0.6rem 1.2rem; font-size: 0.88rem; font-weight: 800; cursor: pointer;
      font-family: inherit; text-decoration: none; transition: opacity 0.15s;
    }
    .wa-btn:hover { opacity: 0.88; }
    .signin-link { display: block; text-align: center; margin-top: 1rem; font-size: 0.82rem; color: #6b7897; }
    .signin-link a { color: #29ffb8; font-weight: 700; text-decoration: none; }
    .signin-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔑</div>
    <h1>Activate Your License</h1>
    <p class="sub">Enter the license key you received after purchase to unlock full access.</p>

    <label>License Key</label>
    <input id="key" class="key-input" type="text" placeholder="SCAN-XXXX-XXXX-XXXX-XXXX" maxlength="24" autocomplete="off">
    <button id="activateBtn" class="auth-btn">Activate</button>
    <div id="msg" class="msg"></div>

    <hr class="divider">
    <p class="wa-text">Don't have a license key? Contact us on WhatsApp.</p>
    <a id="waLink" class="wa-btn" href="#" target="_blank">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Contact on WhatsApp
    </a>
    <button class="sh-dd-item sh-dd-signout" id="shDdSignout">🚪 Sign Out</button>
    <p class="signin-link">Already have an account? <a href="/login">Sign in</a></p>
  </div>

  <script src="/js/fingerprint.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const msg = $('msg');

    fetch('/api/public/whatsapp').then(r => r.json()).then(d => {
      if (d.whatsapp) {
        const num = d.whatsapp.replace(/\D/g, '');
        $('waLink').href = `https://wa.me/${num}`;
      }
    }).catch(() => {});

    async function doActivate() {
      const key = $('key').value.trim().toUpperCase();
      const btn = $('activateBtn');
      if (!key) { msg.style.color = '#f56565'; msg.textContent = 'Please enter your license key.'; return; }
      btn.disabled = true; btn.textContent = 'Activating...';
      msg.textContent = '';
      try {
        const deviceFingerprint = (typeof window.getDeviceFingerprint === 'function') ? window.getDeviceFingerprint() : '';
        const r = await fetch('/api/license/activate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, deviceFingerprint }),
        });
        const d = await r.json();
        if (!r.ok) { msg.style.color = '#f56565'; msg.textContent = d.error || 'Activation failed.'; return; }
        msg.style.color = '#29ffb8'; msg.textContent = 'License activated! Redirecting...';
        setTimeout(() => { window.location.href = '/'; }, 1000);
      } catch (_) {
        msg.style.color = '#f56565'; msg.textContent = 'Network error. Please try again.';
      } finally {
        btn.disabled = false; btn.textContent = 'Activate';
      }
    }
 document.getElementById('shDdSignout').addEventListener('click', async e => {
    e.stopPropagation();
    try { await fetch('/api/auth/logout', { method: 'POST' }); } catch(_) {}
    window.location.href = '/login';
  });

    $('activateBtn').addEventListener('click', doActivate);
    $('key').addEventListener('keydown', e => { if (e.key === 'Enter') doActivate(); });
  </script>
</body>
</html>
