<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title id="pageTitle">Coin Detail</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--bg-card:#0d1117;--bg-raised:#111827;--bg-input:#0f1319;
  --border:#1a2030;--border-dim:#141b28;
  --text-primary:#e5e9f2;--text-secondary:#9aa3b5;--text-muted:#5a6478;
  --accent:#29ffb8;--accent-amber:#f59e0b;
  --green:#22c55e;--red:#ef4444;--blue:#4da8ff;
  --font-ui:'Inter',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:8px;--radius-sm:6px;
}
html,body{height:100%;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);font-size: 15px;overflow:hidden}

/* Layout */
.cd-layout{display:flex;flex-direction:column;}
.cd-header{
  display:flex;align-items:center;gap:1rem;padding:0 1rem;
  background:var(--bg-card);border-bottom:1px solid var(--border);
  flex-shrink:0;height:44px;
}
.cd-back{
  display:flex;align-items:center;gap:0.35rem;color:var(--text-muted);
  text-decoration:none;font-size: 0.87rem;font-weight:600;
  padding:0.25rem 0.6rem;border:1px solid var(--border);border-radius:var(--radius-sm);
  transition:color .15s,border-color .15s;
}
.cd-back:hover{color:var(--text-primary);border-color:var(--text-muted)}
.cd-sym-badge{font-size:1rem;font-weight:800;color:var(--text-primary)}
.cd-price-badge{font-family:var(--font-mono);font-size: 0.95rem;color:var(--accent)}
.cd-pct-badge{font-family:var(--font-mono);font-size: 0.9rem;font-weight:700}
.cd-nav-links{margin-left:auto;display:flex;gap:0.5rem}
.cd-nav-btn{
  padding:0.25rem 0.65rem;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:transparent;color:var(--text-muted);cursor:pointer;font-size: 0.85rem;
  font-family:var(--font-ui);font-weight:600;text-decoration:none;
  transition:all .15s;
}
body{
    overflow : auto
}
.cd-nav-btn:hover{color:var(--text-primary);border-color:var(--text-muted)}

.cd-body{display:flex;overflow:hidden; height : 100vh !important}

/* TV chart */
#cdTvContainer{width:100%;flex:1;min-height:50vh;background:#0d1117}

/* Below section (Positions + Orders) */
.cd-below{flex-shrink:0;height:36vh;display:flex;flex-direction:column;border-top:1px solid var(--border);background:var(--bg-card)}
.cd-below-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;background:#0a0e1a; }
.cd-below-tab{max-width: 150px;
  flex:1;padding:0.5rem 0.4rem;border:none;background:transparent;
  color:var(--text-muted);cursor:pointer;font-size: 0.85rem;font-weight:600;
  font-family:var(--font-ui);border-bottom:2px solid transparent;transition:all .15s;
}
.cd-below-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.cd-below-page{display:none;flex:1;overflow-y:auto;padding:0.75rem}
.cd-below-page.active{display:block}

/* Sidebar */

/* Balance strip */

/* Tabs */
.cd-tabs{
  display:flex;border-bottom:1px solid var(--border);flex-shrink:0;
  background:#0a0e1a;
}
.cd-tab{
  flex:1;padding:0.5rem 0.4rem;border:none;background:transparent;
  color:var(--text-muted);cursor:pointer;font-size: 0.85rem;font-weight:600;
  font-family:var(--font-ui);border-bottom:2px solid transparent;
  transition:all .15s;
}
.cd-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.cd-tab-badge{
  display:inline-block;background:#1a2030;color:var(--text-muted);
  border-radius:10px;font-size: 12px;padding:0.05rem 0.35rem;margin-left:4px;
  font-weight:700;
}

/* Tab pages */
.cd-page{display:none;flex:1;overflow-y:auto;padding:0.75rem}
.cd-page.active{display:block}

/* Order form */

.cd-field{margin-bottom:0.6rem}
.cd-field label{display:block;font-size: 0.82rem;color:var(--text-muted);margin-bottom:0.22rem;font-weight:600}
.cd-input{
  width:100%;background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--text-primary);
  padding:0.38rem 0.6rem;font-size: 0.92rem;font-family:var(--font-ui);
  outline:none;transition:border-color .15s;
}
.cd-input:focus{border-color:var(--accent)}
.cd-input::placeholder{color:var(--text-muted)}
.cd-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}

/* Leverage row */
.lev-row{display:flex;align-items:center;gap:0.5rem}
.lev-row input[type=range]{flex:1;accent-color:var(--accent-amber)}
.lev-num{
  width:44px;background:var(--bg-input);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--accent-amber);font-weight:700;
  font-size: 15px;font-family:var(--font-ui);outline:none;text-align:center;padding:0.25rem 0;
}

/* Qty mode tabs */
.qty-modes{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:0.35rem}
.qty-mode-btn{
  flex:1;padding:0.28rem;border:none;background:var(--bg-input);
  color:var(--text-muted);font-size: 12px;font-weight:700;cursor:pointer;
  font-family:var(--font-ui);border-right:1px solid var(--border);transition:all .15s;
}
.qty-mode-btn:last-child{border-right:none}
.qty-mode-btn.active{background:#1a2f1a;color:var(--accent-amber)}

/* Summary box */
.cd-summary{
  margin-top:0.5rem;background:var(--bg-raised);border:1px solid var(--border-dim);
  border-radius:var(--radius-sm);padding:0.5rem 0.65rem;font-size: 13px;
  display:grid;grid-template-columns:1fr 1fr;gap:0.25rem;
}
.cd-summary .si{color:var(--text-muted)}
.cd-summary .sv{font-family:var(--font-mono);font-weight:700}

/* Place order button */
.cd-place-btn{
  width:100%;padding:0.6rem;border-radius:var(--radius-sm);border:none;
  font-size: 0.95rem;font-weight:700;cursor:pointer;margin-top:0.5rem;
  font-family:var(--font-ui);transition:opacity .15s;
}
.cd-place-btn.long{background:var(--green);color:#000}
.cd-place-btn.short{background:var(--red);color:#fff}
.cd-place-btn:hover{opacity:.88}
.cd-place-btn:disabled{opacity:.45;cursor:not-allowed}

#cdOrderMsg{font-size: 13px;min-height:1em;margin-top:0.4rem;font-weight:600}

/* Positions & orders */
.byt-pos-card{
  background:var(--bg-raised);border:1px solid var(--border-dim);
  border-radius:var(--radius-sm);padding:0.65rem;margin-bottom:0.6rem;
}
.byt-pos-card.long-pos{border-left:3px solid var(--green)}
.byt-pos-card.short-pos{border-left:3px solid var(--red)}
.pos-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.45rem}
.pos-sym{font-weight:800;font-size: 0.95rem}
.pos-dir{
  font-size: 13px;font-weight:700;padding:0.1rem 0.4rem;border-radius:4px;
}
.pos-dir.long{background:rgba(34,197,94,.15);color:var(--green)}
.pos-dir.short{background:rgba(239,68,68,.15);color:var(--red)}
.pos-lev{font-size: 13px;color:var(--text-muted)}
.pos-pnl{font-family:var(--font-mono);font-size: 15px;font-weight:700}
.pos-pnl.profit{color:var(--green)}
.pos-pnl.loss{color:var(--red)}
.pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.35rem;margin-bottom:0.5rem}
.pos-item .pi-label{font-size: 13px;color:var(--text-muted)}
.pos-item .pi-val{font-size: 13px;font-family:var(--font-mono);font-weight:600}
.pos-actions{display:flex;gap:0.4rem}
.pos-act{
  padding:0.25rem 0.5rem;border-radius:4px;font-size: 13px;font-weight:600;
  cursor:pointer;border:1px solid;font-family:var(--font-ui);transition:opacity .15s;
}
.pos-act:hover{opacity:.8}
.pos-act.modify{border-color:#3a7bd5;color:#3a7bd5;background:transparent}
.pos-act.half{border-color:#f59e0b;color:#f59e0b;background:transparent}
.pos-act.close{border-color:var(--red);color:var(--red);background:transparent}

.ord-card{
  background:var(--bg-raised);border:1px solid var(--border-dim);
  border-radius:var(--radius-sm);padding:0.55rem 0.65rem;margin-bottom:0.5rem;
  display:flex;justify-content:space-between;align-items:center;gap:0.5rem;
}
.ord-info{flex:1;min-width:0}
.ord-sym{font-weight:800;font-size: 0.93rem}
.ord-detail{font-size: 13px;color:var(--text-muted);margin-top:0.2rem}
.ord-cancel{
  padding:0.22rem 0.5rem;border-radius:4px;border:1px solid var(--red);
  color:var(--red);background:transparent;cursor:pointer;font-size: 13px;
  font-family:var(--font-ui);transition:opacity .15s;flex-shrink:0;
}
.ord-cancel:hover{opacity:.8}

.cd-empty{
  text-align:center;color:var(--text-muted);padding:2rem 1rem;
  font-size: 0.92rem;
}
.cd-refresh-btn{
  display:block;margin:0 auto 0.75rem;padding:0.3rem 0.75rem;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:transparent;color:var(--text-muted);cursor:pointer;
  font-size: 13px;font-family:var(--font-ui);transition:all .15s;
}
.cd-refresh-btn:hover{border-color:var(--accent);color:var(--accent)}

/* SL/TP modify modal */
.cd-modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  align-items:center;justify-content:center;z-index:100;
}
.cd-modal-overlay.open{display:flex}
.cd-modal-box{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:10px;padding:1.25rem;width:280px;
}
.cd-modal-box h4{font-size: 0.95rem;margin-bottom:0.85rem;color:var(--text-primary)}
.cd-modal-footer{display:flex;gap:0.5rem;margin-top:0.75rem}
.cd-modal-footer button{
  flex:1;padding:0.42rem;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-primary);cursor:pointer;font-size: 0.9rem;
  font-family:var(--font-ui);font-weight:600;transition:all .15s;
}
.cd-modal-footer .save-btn{background:var(--green);border-color:var(--green);color:#000}
.cd-modal-footer .save-btn:hover{opacity:.88}

@media(max-width:900px){
  .cd-body{flex-direction : column}
  #cdTvContainer{max-width: 100%;}
  .cd-below{height:30vh}
}

/* Chart area */
.cd-chart-area{
  flex:1 1 0;min-width:0;display:flex;flex-direction:column;overflow:hidden;
}
.cd-no-chart{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--text-muted);font-size:13px;gap:0.5rem;
}
/* Assets tab */
.cd-assets-table{width:100%;border-collapse:collapse;font-size:13px}
.cd-assets-table th{text-align:left;color:var(--text-muted);font-weight:600;padding:0.3rem 0.5rem;border-bottom:1px solid var(--border-dim);font-size:12px}
.cd-assets-table td{padding:0.35rem 0.5rem;border-bottom:1px solid var(--border-dim);font-family:var(--font-mono);color:var(--text-primary)}
.cd-assets-table tr:last-child td{border-bottom:none}
.cd-asset-sell-btns{display:flex;gap:0.3rem}
.cd-asset-sell-btns button{padding:0.2rem 0.5rem;border-radius:4px;border:1px solid var(--border);background:none;color:#ef4444;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-ui);transition:all .15s}
.cd-asset-sell-btns button:hover{background:rgba(239,68,68,.15);border-color:#ef4444}

/* ── AI Analyze Drawer ── */
.cd-ai-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200}
.cd-ai-overlay.open{display:block}
.cd-ai-drawer{
  position:fixed;top:44px;right:0;bottom:0;width:360px;max-width:100vw;
  background:#0d1117;border-left:1px solid var(--border);
  display:flex;flex-direction:column;z-index:201;
  transform:translateX(100%);transition:transform .25s ease;
}
.cd-ai-drawer.open{transform:translateX(0)}
.cd-ai-drawer-hd{
  display:flex;align-items:center;gap:0.5rem;padding:0.65rem 1rem;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.cd-ai-drawer-title{font-size:0.9rem;font-weight:800;color:var(--text-primary);flex:1}
.cd-ai-tf-sel{
  background:#111827;border:1px solid var(--border);border-radius:5px;
  color:var(--text-secondary);font-family:var(--font-ui);font-size:0.75rem;
  padding:0.2rem 0.4rem;cursor:pointer;outline:none;
}
.cd-ai-tf-sel:focus{border-color:#7c3aed}
.cd-ai-close-x{background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem;padding:0 0.25rem;line-height:1}
.cd-ai-close-x:hover{color:var(--text-primary)}
.cd-ai-run-btn{
  margin:0.75rem 1rem 0;display:flex;align-items:center;justify-content:center;gap:0.4rem;
  background:#1e1433;border:1px solid #7c3aed;border-radius:6px;
  color:#a855f7;font-family:var(--font-ui);font-size:0.82rem;font-weight:700;
  padding:0.48rem;cursor:pointer;transition:all .15s;flex-shrink:0;
}
.cd-ai-run-btn:hover{background:#7c3aed;color:#fff}
.cd-ai-run-btn:disabled{opacity:.5;cursor:not-allowed}
.cd-ai-body{flex:1;overflow-y:auto;padding:0.85rem 1rem}
</style>
</head>
<body>

<div class="cd-layout">

  <!-- Header -->
  <div class="cd-header">
    <a href="/scanner" class="cd-back">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>

<!-- ── AI Analyze Drawer ── -->

    Analyze with AI

<!-- Modify SL/TP modal -->
<div class="cd-modal-overlay" id="cdModifyOverlay">
  <div class="cd-modal-box">
    <h4>✏️ Modify SL / TP</h4>
    <div class="cd-field">
      <label>Stop Loss</label>
      <input type="number" class="cd-input" id="cdModSL" placeholder="Price" step="any" style="border-color:#7f1d1d"/>
    </div>
    <div class="cd-field">
      <label>Take Profit</label>
      <input type="number" class="cd-input" id="cdModTP" placeholder="Price" step="any" style="border-color:#14532d"/>
    </div>

    <input type="hidden" id="cdModSide"/>

      <button onclick="cdModifyOverlay(false)">Cancel</button>
      <button class="save-btn" onclick="cdSubmitModify()">Save</button>

<script>
// ── Bootstrap ─────────────────────────────────────────────────
const sym = new URLSearchParams(location.search).get('sym') || 'BTCUSDT';
const symBase = sym.replace('USDT', '');

document.title = symBase + ' — Coin Detail';
document.getElementById('hdSym').textContent = symBase + '/USDT';

// ── State ──────────────────────────────────────────────────────
let cdDir = 'Buy';
let cdQtyMode = 'qty';
let cdSlMode = 'price';
let cdTpMode = 'price';
let cdMaxLev = 100;
let cdQtyStep = 0.001;
let cdMinQty  = 0.001;
let cdLivePrice = 0;
let bybitStore = {};
let cdRefreshTimer = null;
let cdCategory = 'linear'; // 'linear' (futures) | 'spot'
let cdTickSize = 0;        // price tick size for rounding

// Stubs for removed order-form functions (sidebar removed)
function cdFetchBalance() {}
function cdSetDir(d) { cdDir = d || cdDir; }
function cdSetCategory(cat) { cdCategory = cat || cdCategory; }
function cdSymChanged() {}
// ── TV save/load adapter (localStorage) ───────────────────────
const TV_CHARTS_KEY = 'monty_tv_charts_v1';
const tvSaveLoadAdapter = {
    getAllCharts: function(cb) {
        try { const d = JSON.parse(localStorage.getItem(TV_CHARTS_KEY)||'[]');
              cb(d.map(c=>({id:c.id,name:c.name,symbol:c.symbol,resolution:c.resolution,timestamp:c.timestamp}))); }
        catch(e) { cb([]); }
    },
    removeChart: function(id, cb) {
        try { const d = JSON.parse(localStorage.getItem(TV_CHARTS_KEY)||'[]');
              localStorage.setItem(TV_CHARTS_KEY, JSON.stringify(d.filter(c=>c.id!==id))); cb(); }
        catch(e) { cb(); }
    },
    saveChart: function(data, cb) {
        try { const d = JSON.parse(localStorage.getItem(TV_CHARTS_KEY)||'[]');
              const id = (data.id != null && data.id !== '') ? String(data.id) : String(Date.now());
              const record = Object.assign({}, data, { id: id });
              const i = d.findIndex(c=>c.id===id);
              if(i>=0) d[i]=record; else d.push(record);
              localStorage.setItem(TV_CHARTS_KEY, JSON.stringify(d)); cb(id); }
        catch(e) { cb(String(Date.now())); }
    },
    getChartContent: function(id, cb) {
        try { const d = JSON.parse(localStorage.getItem(TV_CHARTS_KEY)||'[]');
              const c = d.find(x=>x.id===id); cb(c ? c.content : null); }
        catch(e) { cb(null); }
    }
};

// ── TradingView ────────────────────────────────────────────────
const TF_MAP = {'1m':'1','3m':'3','5m':'5','15m':'15','30m':'30','1h':'60','2h':'120','4h':'240','8h':'480','1d':'D','3d':'3D','1w':'W'};
(function initTV() {
    if (!window.TradingView) { setTimeout(initTV, 300); return; }
    new TradingView.widget({
        container_id: 'cdTvContainer',
        symbol: 'BYBIT:' + sym,
        interval: '60',
        theme: 'dark',
        backgroundColor: '#0a0e1a',
        gridColor: '#1a2035',
        width: '100%',
        height: '100%',
        hide_side_toolbar: false,
        allow_symbol_change: true,
        locale: 'en',
        style: '1',
        enable_publishing: false,
        toolbar_bg: '#0d1117',
        withdateranges: true,
        autosize: true,
        save_load_adapter: tvSaveLoadAdapter,
        auto_save_delay: 5,
        charts_storage_api_version: '1.1',
    });
})();

// ── Bybit Credentials ──────────────────────────────────────────
async function loadCreds() {
    try {

// ── HMAC signing (pure JS — works on HTTP and in Node.js) ─────
function hmac256(secret, msg) {
    function sha256bytes(data) {
        const K = [
            0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
            0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
            0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
            0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
            0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
            0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
            0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
            0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
        ];
        let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
        const bytes = typeof data === 'string' ? new TextEncoder().encode(data) : data;
        const len = bytes.length;
        const padded = new Uint8Array(Math.ceil((len + 9) / 64) * 64);
        padded.set(bytes); padded[len] = 0x80;
        const dv = new DataView(padded.buffer);
        dv.setUint32(padded.length - 4, (len * 8) >>> 0, false);
        dv.setUint32(padded.length - 8, Math.floor(len / 0x20000000), false);
        const rotr = (x, n) => (x >>> n) | (x << (32 - n));
        for (let off = 0; off < padded.length; off += 64) {
            const w = new Uint32Array(64);
            for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
            for (let i = 16; i < 64; i++) {
                const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
                const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
                w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
            }
            let [a,b,c,d,e,f,g,hh] = h;
            for (let i = 0; i < 64; i++) {
                const t1 = (hh + (rotr(e,6)^rotr(e,11)^rotr(e,25)) + ((e&f)^(~e&g)) + K[i] + w[i]) >>> 0;
                const t2 = ((rotr(a,2)^rotr(a,13)^rotr(a,22)) + ((a&b)^(a&c)^(b&c))) >>> 0;
                hh=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
            }
            h[0]=(h[0]+a)>>>0; h[1]=(h[1]+b)>>>0; h[2]=(h[2]+c)>>>0; h[3]=(h[3]+d)>>>0;
            h[4]=(h[4]+e)>>>0; h[5]=(h[5]+f)>>>0; h[6]=(h[6]+g)>>>0; h[7]=(h[7]+hh)>>>0;
        }
        const out = new Uint8Array(32);
        h.forEach((v,i) => new DataView(out.buffer).setUint32(i*4, v, false));
        return out;
    }
    function toBytes(s) { return typeof s === 'string' ? new TextEncoder().encode(s) : s; }
    let key = toBytes(secret);
    if (key.length > 64) { const h = sha256bytes(key); key = h; }
    const padded = new Uint8Array(64); padded.set(key);
    const ipad = padded.map(b => b ^ 0x36);
    const opad = padded.map(b => b ^ 0x5c);
    const m = toBytes(msg);
    const inner = new Uint8Array(64 + m.length); inner.set(ipad); inner.set(m, 64);
    const outer = new Uint8Array(64 + 32); outer.set(opad); outer.set(sha256bytes(inner), 64);
    return Array.from(sha256bytes(outer)).map(b => b.toString(16).padStart(2,'0')).join('');
}
let clockOff = 0;
async function syncClock() {
    try {
        const r = await fetch('/api/proxy/binance?path=/fapi/v1/time');
        const d = await r.json();
        const st = parseInt(d.serverTime);
        if (st) clockOff = st - Date.now();
    } catch(_) {}
}
async function bybitReq(method, path, params, body) {
    const c = getCreds();
    if (!c.apiKey || !c.apiSecret) throw new Error('No API credentials. Add them in Settings → Bybit.');
    const base = c.env === 'testnet' ? 'https://api-demo.bybit.com' : 'https://api.bybit.com';
    const ts = (Date.now() + clockOff).toString();
    const recv = '20000';
    let signStr, url;
    if (method === 'GET') {
        const qs = new URLSearchParams(params || {}).toString();
        signStr = ts + c.apiKey + recv + qs;
        url = base + path + (qs ? '?' + qs : '');
    } else {
        const bs = JSON.stringify(body || params || {});
        signStr = ts + c.apiKey + recv + bs;
        url = base + path;
    }
    const sign = hmac256(c.apiSecret, signStr);
    const hdrs = {'X-BAPI-API-KEY':c.apiKey,'X-BAPI-SIGN':sign,'X-BAPI-TIMESTAMP':ts,'X-BAPI-RECV-WINDOW':recv,'Content-Type':'application/json'};
    const opts = {method, headers:hdrs};
    if (method !== 'GET') opts.body = JSON.stringify(body || params || {});
    const resp = await fetch(url, opts);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    return resp.json();
}

async function fetchLivePrice(s) {
    try {
        const r = await fetch(`/api/proxy/binance?path=/fapi/v1/ticker/24hr&symbol=${s}`);
        if (!r.ok) return;
        const d = await r.json();
        cdLivePrice = +(d?.lastPrice || 0);
        document.getElementById('cdEntry').value = cdLivePrice;
        document.getElementById('cdLiveTag').textContent = '● live';
        const pct = +(d?.priceChangePercent || 0);
        const pctEl = document.getElementById('hdPct');
        pctEl.textContent = (pct>=0?'+':'')+pct.toFixed(2)+'%';
        pctEl.style.color = pct>=0 ? '#22c55e' : '#ef4444';
        document.getElementById('hdPrice').textContent = '$' + cdLivePrice.toFixed(4);
        cdUpdateSummary();
    } catch(_) {}
}

    try {
        const r    = await fetch(`/api/proxy/binance?path=/fapi/v1/exchangeInfo&symbol=${s}`);
        const d    = await r.json();
        const info = d.symbols?.[0];
        const ml   = cdCategory === 'spot' ? 1 : (+info?.leverageFilter?.maxLeverage || 100);
        cdMaxLev  = ml;
        const lot = (info?.filters || []).find(f => f.filterType === 'LOT_SIZE') || {};
        const pf  = (info?.filters || []).find(f => f.filterType === 'PRICE_FILTER') || {};
        cdQtyStep  = parseFloat(lot.stepSize || '0.001') || 0.001;
        cdMinQty   = parseFloat(lot.minQty || '0.001');

        document.getElementById('cdLevNum').max    = ml;

}

function cdSetQtyMode(mode, btn) {
    cdQtyMode = mode;
    document.querySelectorAll('.qty-mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['cdQtyNum','cdQtyCostWrap','cdQtyMarginWrap','cdQtyRiskWrap'].forEach(id => {
        document.getElementById(id).style.display = 'none';
    });
    if (mode==='qty')    document.getElementById('cdQtyNum').style.display = '';
    if (mode==='cost')   document.getElementById('cdQtyCostWrap').style.display = '';
    if (mode==='margin') document.getElementById('cdQtyMarginWrap').style.display = '';
    if (mode==='risk')   document.getElementById('cdQtyRiskWrap').style.display = '';
    cdUpdateSummary();
}

function cdGetQty() {
    const entry = +document.getElementById('cdEntry').value || cdLivePrice;
    const lev   = +document.getElementById('cdLevNum').value || 10;
    if (cdQtyMode === 'qty')    return +document.getElementById('cdQtyNum').value;
    if (cdQtyMode === 'cost')   return entry ? (+document.getElementById('cdQtyCost').value / entry) : 0;
    if (cdQtyMode === 'margin') return entry ? (+document.getElementById('cdQtyMargin').value * lev / entry) : 0;
    if (cdQtyMode === 'risk') {
        const sl = +document.getElementById('cdSL').value;
        if (!entry || !sl || sl === entry) return 0;
        const rPct = +document.getElementById('cdRiskSlider').value / 100;
        const eqText = document.getElementById('cdEq').textContent.replace('$','').replace(/,/g,'');
        const equity = parseFloat(eqText) || 0;
        if (!equity) return 0;
        return (equity * rPct) / Math.abs(entry - sl);
    }
    return 0;
}
function cdCalcFromCost()   { cdUpdateSummary(); }
function cdCalcFromMargin() { cdUpdateSummary(); }
function cdCalcFromRisk() {
    const entry = +document.getElementById('cdEntry').value || cdLivePrice;
    const sl    = +document.getElementById('cdSL').value;
    const hint  = document.getElementById('cdQtyHint');
    if (!entry) { hint.textContent = 'Entry price needed'; cdUpdateSummary(); return; }
    if (!sl)    { hint.textContent = 'Set SL price first'; cdUpdateSummary(); return; }
    const eqText = document.getElementById('cdEq').textContent.replace('$','').replace(/,/g,'');
    const equity = parseFloat(eqText) || 0;
    if (!equity) { hint.textContent = '⚠ Balance unavailable — connect API'; cdUpdateSummary(); return; }
    const rPct    = +document.getElementById('cdRiskSlider').value / 100;
    const slDist  = Math.abs(entry - sl);
    if (slDist <= 0) { hint.textContent = 'SL must differ from entry'; cdUpdateSummary(); return; }
    const riskAmt = equity * rPct;
    const qty     = riskAmt / slDist;
    hint.textContent = `~${qty.toFixed(4)} contracts · Risk $${riskAmt.toFixed(2)} of $${equity.toFixed(2)}`;
    cdUpdateSummary();
}

    document.getElementById('cdSLModePrice').style.background = isPrice ? '#7f1d1d' : 'transparent';

}

function cdSetTpMode(mode) {

function cdCalcSlFromPnl() {
    const pnlInput = parseFloat(document.getElementById('cdSLPnl').value);
    const hint = document.getElementById('cdSLHint');
    if (isNaN(pnlInput)) { hint.textContent = ''; document.getElementById('cdSL').value = ''; cdUpdateSummary(); return; }
    const qty   = cdGetQty();
    const entry = +document.getElementById('cdEntry').value || cdLivePrice;
    if (!qty || !entry) { hint.textContent = 'Enter entry & qty first'; return; }
    const isLong  = cdDir === 'Buy';
    const slPrice = isLong ? entry - Math.abs(pnlInput) / qty : entry + Math.abs(pnlInput) / qty;
    if (slPrice <= 0) { hint.textContent = 'Loss too large'; return; }
    const dp = entry >= 1000 ? 2 : entry >= 1 ? 4 : 6;
    document.getElementById('cdSL').value = slPrice.toFixed(dp);
    hint.textContent = `→ SL: ${slPrice.toFixed(dp)} (${isLong ? 'below' : 'above'} entry)`;
    cdUpdateSummary();
}

function cdCalcTpFromPnl() {
    const pnlInput = parseFloat(document.getElementById('cdTPPnl').value);
    const hint = document.getElementById('cdTPHint');
    if (isNaN(pnlInput)) { hint.textContent = ''; document.getElementById('cdTP').value = ''; cdUpdateSummary(); return; }
    const qty   = cdGetQty();
    const entry = +document.getElementById('cdEntry').value || cdLivePrice;
    if (!qty || !entry) { hint.textContent = 'Enter entry & qty first'; return; }
    const isLong  = cdDir === 'Buy';
    const tpPrice = isLong ? entry + Math.abs(pnlInput) / qty : entry - Math.abs(pnlInput) / qty;
    if (tpPrice <= 0) { hint.textContent = 'Value too large'; return; }
    const dp = entry >= 1000 ? 2 : entry >= 1 ? 4 : 6;
    document.getElementById('cdTP').value = tpPrice.toFixed(dp);
    hint.textContent = `→ TP: ${tpPrice.toFixed(dp)} (${isLong ? 'above' : 'below'} entry)`;
    cdUpdateSummary();
}

function cdUpdateSummary() {
    if (!document.getElementById('cdEntry')) return; // sidebar removed
    const entry  = +document.getElementById('cdEntry').value || cdLivePrice;
    const lev    = +document.getElementById('cdLevNum').value || 10;
    const qty    = cdGetQty();
    const sl     = +document.getElementById('cdSL').value;
    const tp     = +document.getElementById('cdTP').value;
    const sumEl  = document.getElementById('cdSummary');
    if (!entry || !qty) { sumEl.style.display='none'; return; }
    sumEl.style.display = 'grid';
    const cost   = entry * qty;
    const margin = cost / lev;
    const slRisk = sl ? Math.abs(sl - entry) * qty : null;
    const tpGain = tp ? Math.abs(tp - entry) * qty : null;
    document.getElementById('cdsCost').textContent   = '$' + cost.toFixed(2);
    document.getElementById('cdsMargin').textContent = '$' + margin.toFixed(2);
    document.getElementById('cdsSLRisk').textContent = slRisk ? '-$' + slRisk.toFixed(2) : '—';
    document.getElementById('cdsTPGain').textContent = tpGain ? '+$' + tpGain.toFixed(2) : '—';
}

async function cdPlaceOrder() {
    const rawSym  = document.getElementById('cdSymInput').value.toUpperCase().trim() || sym;
    const ordType = document.getElementById('cdOrderType').value;
    const lev     = document.getElementById('cdLevNum').value;
    const entry   = document.getElementById('cdEntry').value;
    const qty     = cdGetQty();
    const sl      = document.getElementById('cdSL').value;
    const tp      = document.getElementById('cdTP').value;
    const msgEl   = document.getElementById('cdOrderMsg');
    const btn     = document.getElementById('cdPlaceBtn');
    const step    = cdQtyStep > 0 ? cdQtyStep : 0.001;
    const stepDec = (step.toString().split('.')[1] || '').length;
    // Use precision-safe flooring to avoid floating-point issues (e.g. 0.3/0.1 = 2.9999...)
    const steps   = Math.floor(parseFloat((qty / step).toFixed(8)));
    const qtyStr  = (steps * step).toFixed(stepDec);
    const roundedQty = parseFloat(qtyStr);
    if (!roundedQty || roundedQty <= 0 || roundedQty < cdMinQty) return showMsg(`Qty too small (min ${cdMinQty}) — got ${qty.toFixed(8)}`, '#ef4444');
    if (ordType === 'Limit' && (!+entry || +entry <= 0)) return showMsg('Enter a valid entry price for Limit order', '#ef4444');
    // Helper: round a price to cdTickSize
    function cdRoundPriceStr(p) {
        if (!p || cdTickSize <= 0) return String(p);
        const dec = (cdTickSize.toString().split('.')[1] || '').length;
        return (Math.round(p / cdTickSize) * cdTickSize).toFixed(dec);
    }
    btn.disabled = true;
    btn.textContent = 'Placing…';
    try {
        // Set leverage first (futures only)
        if (cdCategory === 'linear') {
            await bybitReq('POST', '/v5/position/set-leverage', null, {category:'linear', symbol:rawSym, buyLeverage:lev, sellLeverage:lev});
        }
        const payload = {
            category: cdCategory, symbol:rawSym, side:cdDir,
            orderType:ordType, qty: qtyStr,
            timeInForce: ordType==='Market' ? 'IOC' : 'GTC',
        };
        if (cdCategory === 'spot' && ordType === 'Market' && cdDir === 'Buy') payload.marketUnit = 'baseCoin';
        if (ordType === 'Limit' && +entry > 0) payload.price = cdRoundPriceStr(+entry);
        // SL/TP not supported for spot orders
        if (cdCategory !== 'spot') {
            if (sl && parseFloat(sl) > 0) payload.stopLoss   = cdRoundPriceStr(+sl);
            if (tp && parseFloat(tp) > 0) payload.takeProfit = cdRoundPriceStr(+tp);
        }
        // autopilot mode selection
        const mode = document.getElementById('cdModeSelect').value;
        if (mode === 'autopilot') {
            sessionStorage.setItem('bybit_prefill', JSON.stringify({
                sym:rawSym, dir:cdDir==='Buy'?'LONG':'SHORT',
                entry:+entry, sl:+sl, tp:+tp
            }));
        }
        const res = await bybitReq('POST', '/v5/order/create', null, payload);
        if (res.retCode === 0) {
            const spotNote = (cdCategory === 'spot' && ordType === 'Market') ? ' — check Order History on Bybit' : '';
            showMsg('✓ Order placed!' + spotNote, '#22c55e');
            // Notify terminal (other tabs) to refresh positions
            try { new BroadcastChannel('orders').postMessage({ type: 'position:new', symbol: rawSym, side: cdDir }); } catch(_) {}
            if (mode === 'autopilot') setTimeout(() => window.location.href = '/terminal', 1200);
        } else {
            showMsg('✗ ' + res.retMsg, '#ef4444');
        }
    } catch(e) { showMsg('✗ ' + e.message, '#ef4444'); }
    finally {
        btn.disabled = false;
        cdSetDir(cdDir);
    }
}

    try {

        const available = parseFloat(coin?.walletBalance || coin?.free || 0);

        const rawQty = available * pct;
        const step = cdQtyStep > 0 ? cdQtyStep : 0.001;

        const qtyNum = parseFloat(qStr);
        if (!qtyNum || qtyNum <= 0 || qtyNum < cdMinQty) return showMsg(`Qty too small (min ${cdMinQty})`, '#ef4444');
        if (!confirm(`Market sell ${qStr} ${coinName} (${pct*100}% of ${available.toFixed(6)})?`)) return;
        const r = await bybitReq('POST', '/v5/order/create', null, {
            category:'spot', symbol:sym, side:'Sell',
            orderType:'Market', qty:qStr, timeInForce:'IOC'

function cdCalcRSI(closes, period) {
    const rsi = new Array(closes.length).fill(null);
    if (closes.length < period + 1) return rsi;
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) { const d = closes[i]-closes[i-1]; if (d>0) gains+=d; else losses-=d; }
    let ag = gains/period, al = losses/period;
    rsi[period] = al===0 ? 100 : 100-100/(1+ag/al);
    for (let i = period+1; i < closes.length; i++) {
        const d = closes[i]-closes[i-1];
        ag = (ag*(period-1)+Math.max(d,0))/period;
        al = (al*(period-1)+Math.max(-d,0))/period;
        rsi[i] = al===0 ? 100 : 100-100/(1+ag/al);
    }
    return rsi;
}
function cdCalcEMA(values, period) {
    const k = 2/(period+1), ema = values.map(()=>null);
    let first = values.findIndex(v=>v!=null); if (first<0) return ema;
    ema[first] = values[first];
    for (let i=first+1; i<values.length; i++) ema[i] = values[i]*k + ema[i-1]*(1-k);
    return ema;
}
function cdCalcMACD(closes, fast, slow, sig) {
    const ef = cdCalcEMA(closes,fast), es = cdCalcEMA(closes,slow);
    const ml = closes.map((_,i)=>ef[i]!=null&&es[i]!=null?ef[i]-es[i]:null);
    const sl2 = cdCalcEMA(ml,sig);
    return { macd:ml, signal:sl2, hist:ml.map((m,i)=>m!=null&&sl2[i]!=null?m-sl2[i]:null) };
}

function cdOpenAI() {

function cdCalcRsi(closes, period) {
    if (closes.length < period + 1) return closes.map(() => 50);
    let gains = 0, losses = 0;
    for (let i = 1; i <= period; i++) {
        const d = closes[i] - closes[i - 1];
        if (d > 0) gains += d; else losses -= d;
    }
    let avgGain = gains / period, avgLoss = losses / period;
    const rsi = [];
    for (let i = 0; i < period; i++) rsi.push(50);
    rsi.push(avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss));
    for (let i = period + 1; i < closes.length; i++) {
        const d = closes[i] - closes[i - 1];
        avgGain = (avgGain * (period - 1) + Math.max(0, d)) / period;
        avgLoss = (avgLoss * (period - 1) + Math.max(0, -d)) / period;
        rsi.push(avgLoss === 0 ? 100 : avgGain === 0 ? 0 : 100 - 100 / (1 + avgGain / avgLoss));
    }
    return rsi;
}
function cdCalcEma(arr, p) {
    const k = 2 / (p + 1); const out = [arr[0]];
    for (let i = 1; i < arr.length; i++) out.push(arr[i] * k + out[i - 1] * (1 - k));
    return out;
}
function cdCalcMacd(closes, fast, slow, sig) {
    const emaF = cdCalcEma(closes, fast), emaS = cdCalcEma(closes, slow);
    const macdLine = emaF.map((v, i) => v - emaS[i]);
    const sigLine  = cdCalcEma(macdLine, sig);
    const hist     = macdLine.map((v, i) => v - sigLine[i]);
    return { macd: macdLine, signal: sigLine, hist };
}

Current price: ${closes[last]}

MACD: ${macd[last].toFixed(4)}, Signal: ${sigLine[last].toFixed(4)}, Histogram: ${curHist.toFixed(4)} (${histTrend})

Last 50 candles (OHLCV + RSI + MACD):

Based on the technical data above, provide a trade recommendation. Respond ONLY in this exact JSON (no other text):

          <div style="color:#f59e0b;font-weight:700;font-size:0.82rem">${r.rr ?? '—'}</div>
        </div>
        <div style="background:#0a0e1a;border-radius:6px;padding:0.45rem 0.6rem;border:1px solid #22c55e33">
          <div style="color:#5a6478;font-size:0.65rem;margin-bottom:0.12rem">TAKE PROFIT</div>
          <div style="color:#22c55e;font-weight:700;font-size:0.82rem">${r.tp?.toFixed(4) ?? '—'}</div>
        </div>
        <div style="background:#0a0e1a;border-radius:6px;padding:0.45rem 0.6rem;border:1px solid #ef444433">
          <div style="color:#5a6478;font-size:0.65rem;margin-bottom:0.12rem">STOP LOSS</div>
          <div style="color:#ef4444;font-weight:700;font-size:0.82rem">${r.sl?.toFixed(4) ?? '—'}</div>
        </div>
      </div>
    </div>
    <div style="background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:0.85rem;margin-bottom:0.75rem">
      <div style="font-size:0.65rem;font-weight:800;color:#5a6478;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:0.5rem">Reasoning</div>
      <div style="font-size:0.8rem;color:#9aa3b5;line-height:1.6">${r.reasoning}</div>
    </div>
    <a href="/terminal?sym=${sym}&dir=${r.direction === 'LONG' ? 'Buy' : 'Sell'}&entry=${r.entry || ''}&sl=${r.sl || ''}&tp=${r.tp || ''}" target="_blank"
      style="display:flex;align-items:center;justify-content:center;gap:0.4rem;width:100%;background:#0d2818;border:1px solid #22c55e55;border-radius:6px;color:#22c55e;font-size:0.8rem;font-weight:700;padding:0.5rem;text-decoration:none;transition:all .15s"
      onmouseover="this.style.background='#22c55e';this.style.color='#000'" onmouseout="this.style.background='#0d2818';this.style.color='#22c55e'">
      ⚡ Open Trade in Terminal
    </a>`;
}
</script>
<script src="/js/session-check.js"></script>
</body>
</html>
