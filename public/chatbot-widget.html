<!-- Floating AI Chatbot Widget -->
<!-- Include in main layout (e.g., layout.html or base template) -->

<div id="ai-chatbot-widget" class="ai-chatbot-widget">
  <!-- Toggle Button (minimized state) -->
  <div id="chatbot-toggle" class="chatbot-toggle">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    <span class="unread-badge" id="chatbot-unread-badge" style="display: none;">1</span>
  </div>

  <!-- Chat Window (hidden by default) -->
  <div id="chatbot-window" class="chatbot-window" style="display: none;">
    <!-- Header -->
    <div class="chatbot-header">
      <div class="chatbot-header-title">
        <div class="chatbot-avatar">🤖</div>
        <div>
          <h3>Scanr AI Assistant</h3>
          <p class="status-indicator"><span class="status-dot"></span>Online</p>
        </div>
      </div>
      <div class="chatbot-header-actions">
        <button id="chatbot-clear" class="icon-btn" title="Clear chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 4 21 4 23 6 23 20a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6"></polyline>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
        <button id="chatbot-minimize" class="icon-btn" title="Minimize">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="chatbot-messages" class="chatbot-messages">
      <div class="chatbot-welcome">
        <div class="welcome-icon">👋</div>
        <h3>Welcome to Scanr AI!</h3>
        <p>Ask me about trading strategies, platform features, risk management, or technical analysis.</p>
        <div class="quick-buttons">
          <button class="quick-btn" data-query="How do I use the autonomous agent?">Agent Help</button>
          <button class="quick-btn" data-query="What are the best risk management practices?">Risk Mgmt</button>
          <button class="quick-btn" data-query="Explain RSI and MACD signals">Indicators</button>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chatbot-input-area">
      <input
        id="chatbot-input"
        type="text"
        placeholder="Ask me anything about Scanr..."
        class="chatbot-input"
        autocomplete="off"
      />
      <button id="chatbot-send" class="chatbot-send-btn" title="Send message">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

    <!-- Loading Indicator -->
    <div id="chatbot-loading" class="chatbot-loading" style="display: none;">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>
</div>

<!-- Styles -->
