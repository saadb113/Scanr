<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Suspended — Scanr</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050711; font-family: 'Space Grotesk', sans-serif; padding: 24px; }
    .card { background: #0c1017; border: 1px solid #2a1a1a; border-radius: 16px; padding: 2.8rem 2rem; width: 100%; max-width: 400px; text-align: center; }
    .icon { font-size: 52px; margin-bottom: 18px; }
    h1 { font-size: 1.4rem; font-weight: 800; color: #f56565; margin-bottom: 12px; }
    p { font-size: 0.9rem; color: #6b7897; line-height: 1.7; margin-bottom: 2rem; }
    .wa-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; background: #25d366; color: #000; border: none; border-radius: 9px;
      padding: 0.75rem; font-size: 0.95rem; font-weight: 800; cursor: pointer;
      font-family: inherit; text-decoration: none; transition: opacity 0.15s; margin-bottom: 10px;
    }
    .wa-btn:hover { opacity: 0.88; }
    .logout-btn {
      width: 100%; padding: 0.75rem; background: transparent; border: 1px solid #1e2535;
      border-radius: 9px; color: #6b7897; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .logout-btn:hover { border-color: #f56565; color: #f56565; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="pageIcon">⚠️</div>
    <h1 id="pageTitle">Your License Has Been Suspended</h1>
    <p id="pageMsg">Your access to this application has been suspended. Please contact support to resolve this issue and restore your access.</p>
    <a id="waLink" class="wa-btn" href="#" target="_blank">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Contact Support on WhatsApp
    </a>
    <button class="logout-btn" onclick="doLogout()">Sign Out</button>
  </div>

  <script>
    const reason = new URLSearchParams(window.location.search).get('reason');
    if (reason === 'expired') {
      document.getElementById('pageIcon').textContent  = '⏰';
      document.getElementById('pageTitle').textContent = 'Your Demo License Has Expired';
      document.getElementById('pageMsg').textContent   = 'Your demo license has expired. Contact us on WhatsApp to get full access.';
    }

    fetch('/api/public/whatsapp').then(r => r.json()).then(d => {
      if (d.whatsapp) {
        const num = d.whatsapp.replace(/\D/g, '');
        document.getElementById('waLink').href = `https://wa.me/${num}`;
      }
    }).catch(() => {});

    async function doLogout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    }
  </script>
</body>
</html>
