<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Suspended — Scanr</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050711; font-family: 'Space Grotesk', sans-serif; padding: 24px; }
    .card { background: #0c1017; border: 1px solid #2a1a1a; border-radius: 16px; padding: 2.8rem 2rem; width: 100%; max-width: 400px; text-align: center; }
    .icon { font-size: 52px; margin-bottom: 18px; }
    h1 { font-size: 1.4rem; font-weight: 800; color: #f56565; margin-bottom: 12px; }
    p { font-size: 0.9rem; color: #6b7897; line-height: 1.7; margin-bottom: 2rem; }
    .wa-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; background: #25d366; color: #000; border: none; border-radius: 9px;
      padding: 0.75rem; font-size: 0.95rem; font-weight: 800; cursor: pointer;
      font-family: inherit; text-decoration: none; transition: opacity 0.15s; margin-bottom: 10px;
    }
    .wa-btn:hover { opacity: 0.88; }
    .logout-btn {
      width: 100%; padding: 0.75rem; background: transparent; border: 1px solid #1e2535;
      border-radius: 9px; color: #6b7897; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .logout-btn:hover { border-color: #f56565; color: #f56565; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="pageIcon">⚠️</div>
    <h1 id="pageTitle">Your License Has Been Suspended</h1>
    <p id="pageMsg">Your access to this application has been suspended. Please contact support to resolve this issue and restore your access.</p>
    <a id="waLink" class="wa-btn" href="mailto:saadbaig789@gmail.com?subject=License%20Support">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      Contact Support via Email
    </a>
    <button class="logout-btn" onclick="doLogout()">Sign Out</button>
  </div>

  <script>
    const reason = new URLSearchParams(window.location.search).get('reason');
    if (reason === 'expired') {
      document.getElementById('pageIcon').textContent  = '⏰';
      document.getElementById('pageTitle').textContent = 'Your Demo License Has Expired';
      document.getElementById('pageMsg').textContent   = 'Your demo license has expired. Email us at saadbaig789@gmail.com to get full access.';
    }

    async function doLogout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    }
  </script>
</body>
</html>
