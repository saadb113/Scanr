<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Day Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080b11;--bg-card:#0d1117;--bg-raised:#121820;--bg-input:#0a0f16;
  --border:#1c2435;--border-mid:#243044;
  --text-primary:#dde4f0;--text-secondary:#9aa3b5;--text-muted:#5a6478;
  --green:#00e5a0;--red:#ff4d6a;--amber:#f5a623;--blue:#4da8ff;--purple:#a78bfa;
  --green-dim:#051a10;--red-dim:#1a0509;--amber-dim:#1a1100;
  --font-ui:'Space Grotesk',system-ui,sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:10px;--radius-sm:6px;--radius-lg:14px;
}
html,body{min-height:100%;background:var(--bg);color:var(--text-primary);font-family:var(--font-ui);font-size:clamp(14px,1vw,20px);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:1rem 1rem 3rem}
html.light-mode{--bg:#f2f5fb;--bg-card:#fff;--bg-raised:#e8edf6;--bg-input:#edf1f8;--border:#cdd5e3;--border-mid:#b4bfcf;--text-primary:#1a2335;--text-secondary:#445068;--text-muted:#7080a0;}

/* ── Section title ── */
.section-title{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);margin-bottom:0.65rem}

/* ── Card ── */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem;margin-bottom:1.25rem}

/* ── Control bar ── */
.ctrl-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem}
.ctrl-status{display:flex;align-items:center;gap:0.6rem}
.status-dot{width:10px;height:10px;border-radius:50%;background:var(--text-muted);flex-shrink:0;transition:background .3s}
.status-dot.running{background:var(--green);box-shadow:0 0 8px rgba(0,229,160,0.5);animation:pulse 1.5s ease-in-out infinite}
.status-dot.scanning{background:var(--amber);box-shadow:0 0 8px rgba(245,166,35,0.5);animation:pulse 1.5s ease-in-out infinite}
.status-dot.paused{background:var(--blue)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.55}}
.status-label{font-size:1rem;font-weight:700;color:var(--text-primary)}
.status-sub{font-size:0.78rem;color:var(--text-muted)}
.ctrl-btns{display:flex;gap:0.5rem}
.btn-start{background:var(--green);color:#000;border:none;border-radius:var(--radius-sm);padding:0.45rem 1.2rem;font-family:var(--font-ui);font-size:0.88rem;font-weight:800;cursor:pointer;transition:opacity .15s}
.btn-start:hover{opacity:0.85}
.btn-start:disabled{opacity:0.35;cursor:not-allowed}
.btn-stop{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,106,0.3);border-radius:var(--radius-sm);padding:0.45rem 1.2rem;font-family:var(--font-ui);font-size:0.88rem;font-weight:800;cursor:pointer;transition:opacity .15s}
.btn-stop:hover{opacity:0.8}
.btn-stop:disabled{opacity:0.3;cursor:not-allowed}

/* ── Stats row ── */
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:0.65rem;margin-top:0.85rem}
.stat-cell{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.65rem 0.75rem;text-align:center}
.stat-cell .label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:0.2rem}
.stat-cell .value{font-family:var(--font-mono);font-size:1rem;font-weight:800;color:var(--text-primary)}
.value.win{color:var(--green)}
.value.loss{color:var(--red)}

/* ── Active trade card ── */
.trade-card{background:var(--bg-raised);border:1px solid rgba(245,166,35,0.3);border-radius:var(--radius);padding:0.9rem 1.1rem;margin-top:0.85rem}
.trade-card-header{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.55rem}
.trade-sym{font-size:1.1rem;font-weight:800;color:var(--text-primary)}
.trade-badge{display:inline-block;font-size:0.7rem;font-weight:800;text-transform:uppercase;padding:0.15rem 0.45rem;border-radius:4px}
.trade-badge.long{background:var(--green-dim);color:var(--green);border:1px solid #0a3320}
.trade-badge.short{background:var(--red-dim);color:var(--red);border:1px solid #3a0510}
.trade-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:0.45rem}
.trade-stat label{display:block;font-size:0.63rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:0.1rem}
.trade-stat span{font-family:var(--font-mono);font-size:0.85rem;font-weight:700;color:var(--text-secondary)}

/* ── Log feed ── */
.log-feed{margin-top:0.85rem;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.6rem 0.85rem;max-height:200px;overflow-y:auto;font-family:var(--font-mono);font-size:0.77rem}
.log-line{padding:0.1rem 0;border-bottom:1px solid #0f1520;display:flex;gap:0.6rem}
.log-line:last-child{border-bottom:none}
.log-time{color:var(--text-muted);flex-shrink:0}
.log-msg{flex:1}
.log-success .log-msg{color:var(--green)}
.log-error .log-msg{color:var(--red)}
.log-warn .log-msg{color:var(--amber)}
.log-info .log-msg{color:var(--text-secondary)}

/* ── Today's trades table ── */
.trades-tbl{width:100%;border-collapse:collapse;font-size:0.83rem;margin-top:0.5rem}
.trades-tbl thead tr{border-bottom:1px solid var(--border)}
.trades-tbl th{padding:0.4rem 0.65rem;text-align:left;color:var(--text-muted);font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.4px}
.trades-tbl td{padding:0.4rem 0.65rem;border-bottom:1px solid #0f1520;font-family:var(--font-mono);font-size:0.82rem}
.trades-tbl tr:last-child td{border-bottom:none}
.badge{display:inline-block;font-size:0.7rem;font-weight:800;padding:0.15rem 0.4rem;border-radius:4px}
.badge-win{background:#052e16;color:var(--green)}
.badge-loss{background:#3b0a0a;color:var(--red)}
.badge-open{background:#0c1a30;color:var(--blue)}
.empty-row{text-align:center;color:var(--text-muted);font-size:0.85rem;padding:1rem}

/* ── History section ── */
.hist-table{width:100%;border-collapse:collapse;font-size:0.85rem}
.hist-table thead tr{border-bottom:1px solid var(--border)}
.hist-table th{padding:0.4rem 0.65rem;text-align:left;color:var(--text-muted);font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.4px}
.hist-table td{padding:0.45rem 0.65rem;border-bottom:1px solid #0f1520}
.hist-table tr:last-child td{border-bottom:none}
.session-row{cursor:pointer;transition:background .1s}
.session-row:hover{background:var(--bg-raised)}
.trades-detail{display:none}
.trades-detail.open{display:table-row}
.inner-tbl-wrap{margin:0.4rem 0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.loader{text-align:center;padding:2rem;color:var(--text-muted);font-size:0.88rem}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<script src="/js/nav.js"></script>
<div class="wrap">

  <!-- ── Control Panel ── -->
  <div class="section-title">Agent Control</div>
  <div class="card">
    <div class="ctrl-bar">
      <div class="ctrl-status">
        <div class="status-dot" id="statusDot"></div>
        <div>
          <div class="status-label" id="statusLabel">Idle</div>
          <div class="status-sub" id="statusSub">Agent is not running</div>
        </div>
      </div>
      <div class="ctrl-btns">
        <button class="btn-start" id="btnStart" onclick="agStart()">▶ Start</button>
        <button class="btn-stop"  id="btnStop"  onclick="agStop()" disabled>■ Stop</button>
      </div>
    </div>

    <!-- Stats row -->
    <div class="stats-row">
      <div class="stat-cell"><div class="label">Trades</div><div class="value" id="stTrades">—</div></div>
      <div class="stat-cell"><div class="label">Wins</div><div class="value win" id="stWins">—</div></div>
      <div class="stat-cell"><div class="label">Losses</div><div class="value loss" id="stLosses">—</div></div>
      <div class="stat-cell"><div class="label">Daily PnL</div><div class="value" id="stPnl">—</div></div>
      <div class="stat-cell"><div class="label">Con. Losses</div><div class="value" id="stConLoss">—</div></div>
      <div class="stat-cell"><div class="label">Balance</div><div class="value" id="stBal">—</div></div>
    </div>

    <!-- Active trade (hidden when no trade) -->
    <div class="trade-card" id="activeTrade" style="display:none">
      <div class="trade-card-header">
        <span style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--amber)">Active Trade</span>
        <span class="trade-sym" id="trSym">—</span>
        <span class="trade-badge" id="trBadge">—</span>
      </div>
      <div class="trade-stats">
        <div class="trade-stat"><label>Entry</label><span id="trEntry">—</span></div>
        <div class="trade-stat"><label>Stop Loss</label><span id="trSl">—</span></div>
        <div class="trade-stat"><label>Take Profit</label><span id="trTp">—</span></div>
        <div class="trade-stat"><label>AI Score</label><span id="trScore" style="color:var(--purple)">—</span></div>
      </div>
    </div>

    <!-- Live log feed -->
    <div class="log-feed" id="logFeed">
      <div class="log-line log-info"><span class="log-time">--:--</span><span class="log-msg">Waiting for agent…</span></div>
    </div>
  </div>

  <!-- ── Today's Trades ── -->
  <div class="section-title" id="todayTitle">Today's Trades</div>
  <div class="card" style="padding:0;overflow:hidden">
    <table class="trades-tbl" id="todayTable">
      <thead><tr>
        <th>Time</th><th>Symbol</th><th>Dir</th><th>Entry</th><th>Exit</th><th>PnL</th><th>Score</th><th>Result</th>
      </tr></thead>
      <tbody id="todayTbody"><tr><td colspan="8" class="empty-row">No trades this session</td></tr></tbody>
    </table>
  </div>

  <!-- ── Session History ── -->
  <div class="section-title" style="margin-top:0.5rem">Session History</div>
  <div class="card" style="padding:0;overflow:hidden">
    <div class="loader" id="histLoader">Loading sessions…</div>
    <table class="hist-table" id="histTable" style="display:none">
      <thead><tr>
        <th>Date</th><th>Trades</th><th>W/L</th><th>PnL</th><th>Start Bal</th><th>End Bal</th><th>Reason</th>
      </tr></thead>
      <tbody id="histTbody"></tbody>
    </table>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── Helpers ──────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmtP = n => { const v=parseFloat(n)||0; return (v>=0?'+$':'-$')+Math.abs(v).toFixed(2); };
const fmtN = (n,d=4) => '$'+parseFloat(n).toFixed(d);

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Log feed ─────────────────────────────────────────────────
const MAX_LOG = 50;
function agAddLog(level, msg, ts) {
  const feed = $('logFeed');
  // Remove placeholder
  const placeholder = feed.querySelector('.log-msg');
  if (placeholder && placeholder.textContent === 'Waiting for agent…') feed.innerHTML = '';

  const line = document.createElement('div');
  line.className = 'log-line log-' + (level||'info');
  line.innerHTML = `<span class="log-time">${ts||'--:--'}</span><span class="log-msg">${escHtml(msg)}</span>`;
  feed.appendChild(line);
  while (feed.children.length > MAX_LOG) feed.removeChild(feed.firstChild);
  feed.scrollTop = feed.scrollHeight;
}

// ── Status rendering ─────────────────────────────────────────
function applyStatus(st) {
  const dot  = $('statusDot');
  const lbl  = $('statusLabel');
  const sub  = $('statusSub');
  const btnS = $('btnStart');
  const btnX = $('btnStop');

  if (st.running) {
    dot.className  = 'status-dot ' + (st.status === 'scanning' ? 'scanning' : 'running');
    lbl.textContent = st.status === 'scanning' ? 'Scanning…' : st.status === 'paused' ? 'Paused' : 'Running';
    sub.textContent = `${st.tradesTaken||0}/${st.maxTrades||3} trades  •  PST ${st.pstTime||''}`;
    btnS.disabled = true;
    btnX.disabled = false;
  } else {
    dot.className  = 'status-dot';
    lbl.textContent = 'Idle';
    sub.textContent = 'Agent is not running';
    btnS.disabled = false;
    btnX.disabled = true;
  }

  // Stats
  const pnl = parseFloat(st.totalPnl)||0;
  $('stTrades').textContent   = (st.tradesTaken||0) + '/' + (st.maxTrades||3);
  $('stWins').textContent     = st.wins   != null ? st.wins   : '—';
  $('stLosses').textContent   = st.losses != null ? st.losses : '—';
  $('stPnl').textContent      = st.totalPnl != null ? fmtP(pnl) : '—';
  $('stPnl').className        = 'value ' + (pnl >= 0 ? 'win' : 'loss');
  $('stConLoss').textContent  = st.consecutiveLosses != null ? st.consecutiveLosses : '—';
  $('stBal').textContent      = st.startBalance ? '$'+parseFloat(st.startBalance).toFixed(2) : '—';

  // Active trade
  if (st.currentTrade) {
    const t = st.currentTrade;
    $('activeTrade').style.display = 'block';
    $('trSym').textContent   = (t.symbol||'').replace('USDT','');
    const dir = (t.direction||t.side||'').toLowerCase();
    const badge = $('trBadge');
    badge.textContent  = dir.toUpperCase();
    badge.className    = 'trade-badge ' + (dir === 'long' ? 'long' : 'short');
    $('trEntry').textContent = t.entry ? '$'+parseFloat(t.entry).toFixed(4) : '—';
    $('trSl').textContent    = t.sl    ? '$'+parseFloat(t.sl).toFixed(4)    : '—';
    $('trTp').textContent    = t.tp    ? '$'+parseFloat(t.tp).toFixed(4)    : '—';
    $('trScore').textContent = t.score != null ? t.score : '—';
  } else {
    $('activeTrade').style.display = 'none';
  }
}

// ── Today's trades ───────────────────────────────────────────
function renderTodayTrade(t) {
  const tbody  = $('todayTbody');
  // Remove "No trades" placeholder
  const empty = tbody.querySelector('.empty-row');
  if (empty) empty.parentElement.remove();

  const pnl = parseFloat(t.pnl)||0;
  const st  = t.closedAt ? (pnl>=0?'badge-win':'badge-loss') : 'badge-open';
  const sl  = t.closedAt ? (pnl>=0?'WIN':'LOSS') : 'OPEN';
  const dir = (t.direction||t.side||'').toUpperCase();
  const dc  = dir==='LONG'?'var(--green)':'var(--red)';
  const pnlC= pnl>=0?'var(--green)':'var(--red)';
  const pnlT= t.closedAt ? fmtP(pnl) : '—';
  const tm  = t.openedAt ? new Date(t.openedAt).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}) : '—';

  // Check if row exists (for update)
  let tr = document.getElementById('td-' + t._id || t.symbol);
  if (!tr) {
    tr = document.createElement('tr');
    if (t._id) tr.id = 'td-' + t._id;
    tbody.appendChild(tr);
  }
  tr.innerHTML = `
    <td style="color:var(--text-muted)">${tm}</td>
    <td style="color:var(--text-primary);font-weight:800">${t.symbol}</td>
    <td style="color:${dc};font-weight:700">${dir}</td>
    <td style="color:var(--text-secondary)">${t.entryPrice||'—'}</td>
    <td style="color:var(--text-secondary)">${t.closePrice||'—'}</td>
    <td style="color:${pnlC};font-weight:700">${pnlT}</td>
    <td style="color:var(--purple)">${t.aiScore||'—'}</td>
    <td><span class="badge ${st}">${sl}</span></td>
  `;
}

async function loadTodayTrades() {
  try {
    const r = await fetch('/api/agent/today');
    const j = await r.json();
    if (j.ok && j.trades.length) {
      $('todayTbody').innerHTML = '';
      j.trades.forEach(renderTodayTrade);
    }
  } catch {}
}

// ── Start / Stop ─────────────────────────────────────────────
async function agStart() {
  $('btnStart').disabled = true;
  agAddLog('info', 'Starting agent…', '');
  try {
    const r = await fetch('/api/agent/start', { method: 'POST' });
    const j = await r.json();
    if (!j.ok) {
      agAddLog('error', j.error || 'Failed to start', '');
      $('btnStart').disabled = false;
    }
  } catch (e) {
    agAddLog('error', e.message, '');
    $('btnStart').disabled = false;
  }
}

async function agStop() {
  $('btnStop').disabled = true;
  agAddLog('warn', 'Stopping agent…', '');
  try {
    await fetch('/api/agent/stop', { method: 'POST' });
  } catch (e) {
    agAddLog('error', e.message, '');
    $('btnStop').disabled = false;
  }
}

// ── Socket.io ────────────────────────────────────────────────
try {
  const sock = io();

  sock.on('agent:log', ({ level, message, ts }) => {
    agAddLog(level, message, ts);
  });

  sock.on('agent:status_update', st => {
    applyStatus(st);
  });

  sock.on('agent:started', data => {
    agAddLog('success', `Agent started — balance $${parseFloat(data.startBalance||0).toFixed(2)}`, '');
    loadTodayTrades();
  });

  sock.on('agent:stopped', ({ reason, totalPnl, tradesTaken }) => {
    agAddLog('warn', `Agent stopped: ${reason} | trades=${tradesTaken} pnl=${fmtP(totalPnl)}`, '');
    $('activeTrade').style.display = 'none';
    loadHistory();
  });

  sock.on('agent:paused', ({ reason }) => {
    agAddLog('warn', 'Agent paused: ' + reason, '');
  });

  sock.on('agent:trade_placed', data => {
    agAddLog('success', `Trade placed: ${data.symbol} ${(data.direction||'').toUpperCase()}`, '');
  });

  sock.on('agent:trade_closed', data => {
    const pnl = parseFloat(data.pnl)||0;
    agAddLog(pnl>=0?'success':'error', `Trade closed: ${data.symbol} ${fmtP(pnl)}`, '');
    loadTodayTrades();
  });
} catch {}

// ── Poll status on load ───────────────────────────────────────
async function pollStatus() {
  try {
    const r = await fetch('/api/agent/status');
    const j = await r.json();
    applyStatus(j);
    if (j.running) loadTodayTrades();
  } catch {}
}

// ── Session History ───────────────────────────────────────────
async function loadHistory() {
  try {
    const r = await fetch('/api/agent/history?limit=60');
    const j = await r.json();
    $('histLoader').style.display = 'none';
    if (!j.ok || !j.sessions.length) {
      $('histLoader').style.display = 'block';
      $('histLoader').textContent = 'No sessions yet.';
      return;
    }
    const tbody = $('histTbody');
    tbody.innerHTML = '';
    j.sessions.forEach(s => {
      const pnl    = parseFloat(s.totalPnl)||0;
      const pnlCls = pnl>=0?'var(--green)':'var(--red)';
      const pnlTxt = fmtP(pnl);

      const tr = document.createElement('tr');
      tr.className = 'session-row';
      tr.dataset.sid = s._id;
      tr.innerHTML = `
        <td style="color:var(--text-primary);font-weight:700;font-family:var(--font-mono)">${s.date||'—'}</td>
        <td style="color:var(--text-secondary)">${s.tradesTaken||0}</td>
        <td><span style="color:var(--green)">${s.wins||0}W</span> / <span style="color:var(--red)">${s.losses||0}L</span></td>
        <td style="color:${pnlCls};font-weight:700;font-family:var(--font-mono)">${pnlTxt}</td>
        <td style="color:var(--text-muted);font-family:var(--font-mono)">${s.startBalance?'$'+parseFloat(s.startBalance).toFixed(2):'—'}</td>
        <td style="color:var(--text-muted);font-family:var(--font-mono)">${s.endBalance?'$'+parseFloat(s.endBalance).toFixed(2):'—'}</td>
        <td style="color:var(--text-muted);font-size:0.78rem">${s.endReason||'—'}</td>
      `;
      tbody.appendChild(tr);

      // Detail row
      const detailTr = document.createElement('tr');
      detailTr.className = 'trades-detail';
      detailTr.id = 'det-' + s._id;
      const detailTd = document.createElement('td');
      detailTd.colSpan = 7;
      detailTd.style.padding = '0 0.65rem 0.65rem';
      detailTd.innerHTML = '<div style="color:var(--text-muted);font-size:0.82rem;padding:0.4rem">Loading…</div>';
      detailTr.appendChild(detailTd);
      tbody.appendChild(detailTr);

      tr.addEventListener('click', async () => {
        const detRow = document.getElementById('det-' + s._id);
        const isOpen = detRow.classList.contains('open');
        if (isOpen) { detRow.classList.remove('open'); return; }
        detRow.classList.add('open');
        try {
          const dr = await fetch('/api/agent/history/' + s._id);
          const dj = await dr.json();
          if (!dj.ok || !dj.trades.length) {
            detailTd.innerHTML = '<div style="color:var(--text-muted);font-size:0.82rem;padding:0.4rem">No trades recorded.</div>';
            return;
          }
          let html = `<div class="inner-tbl-wrap"><table style="width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:0.8rem">
            <thead><tr style="background:var(--bg)">
              <th style="padding:0.3rem 0.5rem;color:var(--text-muted);font-family:var(--font-ui)">Time</th>
              <th style="padding:0.3rem 0.5rem;color:var(--text-muted);font-family:var(--font-ui)">Symbol</th>
              <th style="padding:0.3rem 0.5rem;color:var(--text-muted);font-family:var(--font-ui)">Dir</th>
              <th style="padding:0.3rem 0.5rem;color:var(--text-muted);font-family:var(--font-ui)">Entry</th>
              <th style="padding:0.3rem 0.5rem;color:var(--text-muted);font-family:var(--font-ui)">Exit</th>
              <th style="padding:0.3rem 0.5rem;color:var(--text-muted);font-family:var(--font-ui)">PnL</th>
              <th style="padding:0.3rem 0.5rem;color:var(--text-muted);font-family:var(--font-ui)">Score</th>
              <th style="padding:0.3rem 0.5rem;color:var(--text-muted);font-family:var(--font-ui)">Result</th>
            </tr></thead><tbody>`;
          dj.trades.forEach(t => {
            const tp = parseFloat(t.pnl)||0;
            const bs = t.closedAt?(tp>=0?'badge-win':'badge-loss'):'badge-open';
            const sl = t.closedAt?(tp>=0?'WIN':'LOSS'):'OPEN';
            const dc = (t.direction||t.side||'').toUpperCase();
            const dclr = dc==='LONG'?'var(--green)':'var(--red)';
            const pclr = tp>=0?'var(--green)':'var(--red)';
            const ptxt = t.closedAt?fmtP(tp):'—';
            const tm  = t.openedAt?new Date(t.openedAt).toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit'}):'—';
            html += `<tr style="border-bottom:1px solid var(--border)">
              <td style="padding:0.3rem 0.5rem;color:var(--text-muted)">${tm}</td>
              <td style="padding:0.3rem 0.5rem;color:var(--text-primary);font-weight:700">${t.symbol}</td>
              <td style="padding:0.3rem 0.5rem;color:${dclr};font-weight:700">${dc}</td>
              <td style="padding:0.3rem 0.5rem;color:var(--text-secondary)">${t.entryPrice||'—'}</td>
              <td style="padding:0.3rem 0.5rem;color:var(--text-secondary)">${t.closePrice||'—'}</td>
              <td style="padding:0.3rem 0.5rem;color:${pclr};font-weight:700">${ptxt}</td>
              <td style="padding:0.3rem 0.5rem;color:var(--purple)">${t.aiScore||'—'}</td>
              <td style="padding:0.3rem 0.5rem"><span class="badge ${bs}">${sl}</span></td>
            </tr>`;
            if (t.aiReasoning) {
              html += `<tr style="background:var(--bg);border-bottom:1px solid var(--border)"><td colspan="8" style="padding:0.25rem 0.5rem 0.35rem;color:var(--text-muted);font-size:0.73rem;font-style:italic;font-family:var(--font-ui)">${escHtml(t.aiReasoning)}</td></tr>`;
            }
          });
          html += '</tbody></table></div>';
          detailTd.innerHTML = html;
        } catch(e) {
          detailTd.innerHTML = '<div style="color:var(--red);font-size:0.82rem;padding:0.4rem">Failed to load trades.</div>';
        }
      });
    });
    $('histTable').style.display = 'table';
  } catch {}
}

// ── Init ─────────────────────────────────────────────────────
pollStatus();
loadHistory();
setInterval(pollStatus, 10000);
</script>
<script src="/js/session-check.js"></script>
</body>
</html>
